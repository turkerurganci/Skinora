# T08 — Auto-provision Loki as default datasource for Grafana.
apiVersion: 1

datasources:
  - name: Loki
    # Pinned for the same reason as Prometheus: a provisioned uid is the only
    # stable handle a rule or dashboard can reference across a re-provision.
    uid: loki
    type: loki
    access: proxy
    url: http://skinora-loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 5000
