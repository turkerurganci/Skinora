# T16 — Grafana Alerting rules (05 §9.3)
# Critical: service down, DB connection lost, blockchain/Steam unreachable
# Warning: error rate high, response time high, disk 80%+, job queue growing
apiVersion: 1

groups:
  # ===========================================================================
  # T165 — notification channels and money alarms ("para alarmı"). Kept as its
  # own group at the top of the file so parallel branches that append to the
  # two groups below do not touch these lines.
  #
  # category: money — the money-alarm contact point (policies.yml): Telegram +
  # e-mail to the operator, whatever the severity. Every chain / sweep /
  # payout / refund / wallet / fee rule above and below carries the label too
  # (T165); a NEW money rule (T169a's refund cap, T170's wallets) only needs
  # `category: money` next to its severity.
  # ===========================================================================
  - orgId: 1
    name: Skinora Notification And Money Alerts
    folder: Skinora Alerts
    interval: 1m
    rules:
      # T169 gate (outbound.auto_send_enabled = false): a payout / refund is
      # sent only after an admin approved it (AD41). Before T165 nobody was
      # told outside the S22 wallets screen. One message when the first row
      # starts waiting, a reminder every 4 h, "resolved" when all are approved.
      - uid: outbound-awaiting-approval
        title: Payouts Or Refunds Waiting For Admin Approval
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max by (network) (skinora_backend_outbound_awaiting_approval_rows) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 1m
        labels:
          severity: warning
          category: money
        annotations:
          summary: 'A payout or refund is waiting for an admin approval on {{ .Labels.network }}'
          description: >-
            While outbound.auto_send_enabled is false (T169, the owner's trial-phase
            decision) every seller payout and buyer refund waits PENDING until an admin
            approves it on the admin wallets screen ("Onay bekleyen ödemeler", AD40/AD41).
            Nothing is sent and the seller / buyer waits. Open the panel, check the row
            (amount, recipient) and approve it.
            skinora_backend_outbound_awaiting_approval_oldest_seconds shows how long the
            oldest row has waited (DEPLOY_RUNBOOK §M).

      # T77 monitor (TRON hot wallet; Ethereum: T170): before T165 a breach was
      # an AuditLog row + a SignalR banner for whoever had the panel open.
      - uid: hot-wallet-threshold-breached
        title: Hot Wallet Beyond Its Threshold
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: max by (network, asset, direction) (skinora_backend_hot_wallet_threshold_breached) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 0s
        labels:
          severity: warning
          category: money
        annotations:
          summary: 'The {{ .Labels.network }} hot wallet is beyond its {{ .Labels.asset }} threshold ({{ .Labels.direction }})'
          description: >-
            direction=upper: the hot wallet holds more USDT / USDC than hot_wallet_limit
            (T169: 4000 per network) — move the excess to cold storage (admin wallets
            screen, AD39; DEPLOY_RUNBOOK §A #18). direction=lower: the gas asset (TRX) is
            under hot_wallet.trx_balance_minimum — payouts and refunds will stall; top it
            up. The alert resolves on the first monitor run within the threshold.
            Ethereum's hot wallet USDT limit is not watched yet (DEFERRED_BACKLOG
            EthereumHotWalletUsdtLimitUnmonitored, T170); its ETH floor is
            ethereum-wallet-eth-low.

      # T165 düzeltme turu — daily ledger reconciliation (05 §3.3 "admin'e
      # critical alert"): before this a ledger / chain mismatch was an AuditLog
      # row + a SignalR banner for whoever had the panel open. The backend
      # publishes the mismatches its last completed round found per network
      # and scope; the alarm resolves when a later round of that scope is
      # balanced. Admins also get ADMIN_RECONCILIATION_MISMATCH in the inbox.
      - uid: reconciliation-mismatch
        title: Ledger And Chain Do Not Match
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max by (network, scope) (skinora_backend_reconciliation_mismatches) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 0s
        labels:
          severity: critical
          category: money
        annotations:
          summary: 'Reconciliation: {{ .Labels.network }} {{ .Labels.scope }} does not match the chain ({{ .Values.A.Value }} mismatch(es))'
          description: >-
            The backend's daily ledger reconciliation (05 §3.3, tolerance zero) found
            the platform's books and the on-chain balance apart (scope = DepositAddress,
            HotWallet or ColdWallet). Money may be missing, or a payout / sweep is not in
            the ledger. Do not approve payouts on that network until it is explained:
            the per-token detail (expected, actual, delta, block) is in the
            RECONCILIATION_MISMATCH audit rows of the admin panel. The alarm resolves
            when a later round of the same scope is balanced (reconciliation.schedule_cron,
            daily); a backend restart clears it until the next round (DEPLOY_RUNBOOK §P.4).

      # Backend money alarms (IAdminMoneyAlarmObserver): the admin-broadcast
      # consumers for a failed / blocked / deferred money movement publish the
      # time of their latest event. Fires for an hour after each one — also when
      # no admin account or admin channel exists.
      - uid: admin-money-alarm-raised
        title: Backend Money Alarm Raised
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (time() - max by (kind) (skinora_backend_admin_money_alarm_last_seconds)) or vector(1e12)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [3600]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 0s
        labels:
          severity: critical
          category: money
        annotations:
          summary: 'Backend money alarm: {{ .Labels.kind }}'
          description: >-
            The backend raised a money alarm in the last hour; the same event is in
            every admin's inbox (ADMIN_PAYMENT_FAILURE / ADMIN_ESCALATION) with the
            transaction id. kind = notifications.transfer-dispatch-failed-admin (a payout
            / refund / sweep exhausted its retries and is FAILED — retry it from the admin
            panel), notifications.refund-blocked-admin (a refund could not be made: amount
            below the minimum or negative after fees — the money stays on the deposit),
            notifications.seller-payout-deferred-admin (the gas estimate ate the whole
            payout three times — restore the hot wallet's energy, DEPLOY_RUNBOOK §C.2),
            notifications.settlement-review-admin (a settlement is parked and holds the
            buyer's money until an admin decides). Fires for one hour after each event; a
            backend restart forgets the time.

      # T165 — a real provider selected without its secrets (or with a
      # placeholder / malformed one): the channel is treated as switched off.
      - uid: notification-channel-misconfigured
        title: Notification Channel Misconfigured
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max by (channel) (skinora_backend_notification_channel_state{state="misconfigured"}) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Notification channel {{ .Labels.channel }} is selected but not configured — nothing is sent on it'
          description: >-
            The backend's provider for this channel is the real one (Resend /
            Telegram), but a secret is missing, still a placeholder or malformed. The
            channel behaves as switched off: users cannot connect it and nothing is sent
            on it. The backend's startup log names the missing keys (never their values).
            Fill them in .env.trial and restart the backend (DEPLOY_RUNBOOK §P).

      # T165 — an external delivery used up its retries (05 §7.5): a revoked
      # Telegram token, a Resend key that lost its domain, the daily quota.
      - uid: notification-delivery-exhausted
        title: Notification Delivery Failed After All Retries
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (time() - max by (channel) (skinora_backend_notification_delivery_exhausted_last_seconds)) or vector(1e12)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [3600]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: 'A {{ .Labels.channel }} notification could not be delivered after all retries'
          description: >-
            A notification delivery on this channel exhausted its retries and is
            FAILED (the in-app notification is still there). One user's blocked bot is
            routine; several in an hour point at the channel itself: a revoked Telegram
            token (401), a Resend key without access or an unverified domain (401/403),
            the Resend daily quota (429, 100 a day on the free plan). Check the backend
            log line "[T37 admin-alert] Notification delivery exhausted retries" and the
            provider dashboard (DEPLOY_RUNBOOK §P). Fires for one hour after the last.

  - orgId: 1
    name: Skinora Critical Alerts
    folder: Skinora Alerts
    interval: 1m
    rules:
      - uid: backend-down
        title: Backend Service Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="skinora-backend"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Backend service is down
          description: The skinora-backend service has been unreachable for more than 2 minutes.

      - uid: steam-sidecar-down
        title: Steam Sidecar Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="skinora-steam-sidecar"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Steam sidecar is down
          description: The skinora-steam-sidecar service has been unreachable for more than 2 minutes.

      - uid: blockchain-sidecar-down
        title: Blockchain Sidecar Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="skinora-blockchain-sidecar"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 2m
        labels:
          severity: critical
          category: money
        annotations:
          summary: Blockchain sidecar is down
          description: The skinora-blockchain-sidecar service has been unreachable for more than 2 minutes.

      # T150 — Ethereum `finalized` stopped advancing (08 §3.7.8; 30 min eşiği
      # T142 ölçümünden: olağan gecikme 12,8–18,8 dk). Eşik tekrarlanmıyor:
      # servis kendi /health'inin uyguladığı eşiği
      # `skinora_ethereum_finalized_stall_threshold_seconds` gauge'una yazıyor
      # (ETHEREUM_FINALIZED_STALL_SECONDS), kural yaşı ona bölüyor — oran > 1.
      # Yaş scrape anında bloğun kendi zaman damgasından hesaplanır; servis
      # başı okuyamıyorsa da yaş büyür. `or vector(0)`: servis kurulu değilken
      # (compose profili "ethereum" kapalı) seri yoktur, kural sessiz kalır.
      - uid: ethereum-finalized-stalled
        title: Ethereum Finality Stalled
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (max(skinora_ethereum_finalized_block_age_seconds) / max(skinora_ethereum_finalized_stall_threshold_seconds)) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 2m
        labels:
          severity: critical
          category: money
        annotations:
          summary: Ethereum finalized block is older than the stall threshold
          description: >-
            The last finalized Ethereum block the Ethereum service read is older
            than its stall threshold (ETHEREUM_FINALIZED_STALL_SECONDS, 30 min by
            default; normal finality lag is 13–19 min). No Ethereum payment can
            be accepted while finality is stalled (11 §F8 K5); the service
            reports unhealthy, so the backend freezes Ethereum payment timeouts
            and closes Ethereum for new transactions. TRON is unaffected.
            Check skinora_ethereum_rpc_failover_total and the providers.

      # T151 (08 §3.7.4, §3.7.8) — bir depozitin token bakiyesi, izleyicinin
      # gördüğü transferlerle uyuşmuyor: sağlayıcı bir log'u hata vermeden
      # atlamış olabilir (T142'de Tenderly'de ölçüldü). Ödeme görülmemiş
      # olabilir. Sayaç artışı 2 saat görünür kalır (saatlik mutabakat).
      - uid: ethereum-deposit-balance-mismatch
        title: Ethereum Deposit Balance Mismatch
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(skinora_ethereum_reconciliation_mismatch_total[2h])) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 0s
        labels:
          severity: critical
          category: money
        annotations:
          summary: An Ethereum deposit's balance does not match the transfers the monitor saw
          description: >-
            The hourly reconciliation found a deposit whose USDT/USDC balance at the
            finalized block moved differently from the Transfer logs the payment
            monitor received — a transfer was missed (a provider that answers
            eth_getLogs incompletely without an error). A buyer's payment may be
            on the deposit unseen. The Ethereum service's error log names the
            address, the asset and the expected / actual amounts; compare with
            the backend's records before acting.

      # T151 (08 §3.7.1) — USDT ücret anahtarı açıldı, kontrat durduruldu ya da
      # kullanımdan kaldırıldı: servis acceptsPayments=false yayınlar, backend
      # Ethereum'u yeni işlemlere kapatır. USDT sözleşmesi tanımsızken seri yok.
      - uid: ethereum-usdt-status
        title: Ethereum USDT Contract Not Usable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: min(skinora_ethereum_usdt_status_ok) or vector(1)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 15m
        labels:
          severity: critical
          category: money
        annotations:
          summary: The Ethereum USDT contract is paused, deprecated or charging a fee
          description: >-
            The Ethereum service read Tether's switches at the finalized block and
            one of them is on (fee rate / maximum fee, paused, deprecated) — or it
            has not been able to read them since start. It declares
            acceptsPayments=false; the backend reports BLOCKCHAIN_ETHEREUM
            unhealthy and keeps Ethereum out of supportedNetworks. TRON is
            unaffected. The service log names the switch.

      - uid: ethereum-nonce-conflict
        title: Ethereum Send Nonce Used Elsewhere
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(skinora_ethereum_outgoing_nonce_conflicts) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 0m
        labels:
          severity: critical
          category: money
        annotations:
          summary: An Ethereum send's nonce was used by a transaction the service did not sign
          description: >-
            The account nonce of a journalled Ethereum send (payout, refund,
            sweep or cold transfer) moved past it while none of its signed
            attempts is on chain (08 §3.7.6). Something outside the Ethereum
            service signed with that key — a compromised key or a manual send.
            Nothing is re-signed automatically; the backend row stays DETECTED
            and its status answers 409 TRANSFER_NONCE_CONFLICT. Stop the
            service, check the account's transactions on Etherscan and the
            journal (DEPLOY_RUNBOOK §D) before anything is re-sent.

      - uid: ethereum-journal-behind-chain
        title: Ethereum Journal Behind Chain — Signing Stopped
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(skinora_ethereum_journal_behind_chain) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 0m
        labels:
          severity: critical
          category: money
        annotations:
          summary: An Ethereum send account is ahead of the transaction journal — no new signatures
          description: >-
            Before a new signature the Ethereum service found the account's
            nonce on chain (pending included) ahead of the highest nonce its
            journal holds (08 §3.7.6). Transactions the journal does not know
            used those nonces: a lost journal volume, a restore from an old
            backup, or a send outside the service. A request id whose record
            is no longer in the journal would be signed again with a new
            nonce — a second payment — so the service signs nothing new for
            that account (503 JOURNAL_BEHIND_CHAIN; backend rows stay
            PENDING). Follow DEPLOY_RUNBOOK §D "ethereum-journal-behind-chain"
            before setting ETHEREUM_JOURNAL_ACKNOWLEDGED_NONCES.

      - uid: ethereum-journal-ack-ahead-of-chain
        title: Ethereum Journal Acknowledgement Ahead Of Chain — Ignored
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(skinora_ethereum_journal_ack_ahead_of_chain) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 0m
        labels:
          severity: critical
          category: money
        annotations:
          summary: An ETHEREUM_JOURNAL_ACKNOWLEDGED_NONCES value is above the chain nonce — ignored
          description: >-
            The acknowledgement configured for an Ethereum send account is
            higher than the account's nonce on chain (pending included) — a
            typo or a stale value. It accounts for no transaction that
            happened, so the service ignores it (T152 doğrulaması): the
            journal-behind-chain check still runs and, if the journal is
            behind, ethereum-journal-behind-chain fires with it and nothing is
            signed. Set the value to the chain nonce found in DEPLOY_RUNBOOK §D
            "ethereum-journal-behind-chain" step 7 and restart the service.

      # T158 (k) — 11 §F8 T151 doğrulamasından: a monitor pass that fails (RPC,
      # retryable webhook answer, T158 (j) 401) is counted and the range is read
      # again; continuous failure means no payment is being reported. The monitor
      # ticks every 15 s, so a healthy service fails a handful of passes at most.
      - uid: ethereum-monitor-scan-failing
        title: Ethereum Payment Monitor Scan Failing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(skinora_ethereum_monitor_scan_failures_total[15m])) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [20]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 5m
        labels:
          severity: critical
          category: money
        annotations:
          summary: The Ethereum payment monitor keeps failing to read or deliver a block range
          description: >-
            More than 20 of the monitor's ~60 passes in 15 minutes failed
            (skinora_ethereum_monitor_scan_failures_total). The failing range is
            read again every pass, so nothing is lost — but no new Ethereum payment
            is reported to the backend while it lasts, and a buyer's payment window
            can run out with the money on chain. Causes: both RPC providers failing
            eth_getLogs, or the backend refusing the webhook in a retryable way (a
            401 is a webhook secret mismatch — ethereum-webhook-signature-refused).
            Read the service log ("payment monitor pass failed") (DEPLOY_RUNBOOK §J).

      # T158 (j) — 11 §F8 T151 doğrulamasından: a 401 used to be a final 4xx and
      # the event was dropped for good; it is now retried, and this rule names the
      # cause directly (ethereum-monitor-scan-failing sees the effect).
      - uid: ethereum-webhook-signature-refused
        title: Ethereum Webhook Signature Refused By The Backend
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(skinora_ethereum_webhook_rejected_total{status="401"}[15m])) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 0m
        labels:
          severity: critical
          category: money
        annotations:
          summary: The backend refuses the Ethereum service's webhook signature (401)
          description: >-
            The backend answered an Ethereum payment webhook with 401: the two sides
            hold different webhook secrets (WEBHOOK_SECRET of the Ethereum service vs
            the backend's ETHEREUM_WEBHOOK_SECRET / Webhook__EthereumSharedSecret).
            The event is kept and sent again every pass until they agree — nothing is
            lost, but no payment is reported meanwhile. Put the same value on both
            sides and restart both (DEPLOY_RUNBOOK §J).

      # T158 (g) — 11 §F8 T152 doğrulamasından (⚠ PARA): fail closed. Every
      # status read of an unverifiable row counts again, so the rule keeps firing
      # while such a row exists.
      - uid: ethereum-transfer-status-unverified
        title: Ethereum Transfer Not Verifiable — Row Not Confirmed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(skinora_ethereum_transfer_status_unverified_total[1h])) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 0m
        labels:
          severity: critical
          category: money
        annotations:
          summary: A final Ethereum transfer unknown to the journal — its Transfer log does not match the backend row
          description: >-
            The status of a mined outgoing Ethereum transfer was asked for a hash the
            service's transaction journal does not hold (a lost or restored journal),
            and the receipt's Transfer log does not match the backend row's contract,
            sender, recipient and amount — or the backend sent no expectation. The
            service answered UNKNOWN; the backend leaves the row DETECTED (never
            CONFIRMED, never FAILED) with ErrorMessage TRANSFER_UNVERIFIED. Find the
            row, compare the hash on Etherscan and decide by hand
            (DEPLOY_RUNBOOK §J "Doğrulanamayan gönderim").

      # T159a (yönetici kararı, ⚠ PARA) — no gas is assumed: every send and
      # its fuel is estimated. An estimate below 21,000 or above 1,000,000 is
      # not believed — nothing is signed, the send waits GAS_ESTIMATE_ABNORMAL.
      # Every refused attempt counts (the backend asks again each minute), so
      # the rule keeps firing while it lasts.
      - uid: ethereum-gas-estimate-abnormal
        title: Ethereum Gas Estimate Abnormal — Send Not Signed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(skinora_ethereum_gas_estimate_abnormal_total[1h])) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 0m
        labels:
          severity: critical
          category: money
        annotations:
          summary: An Ethereum send's gas estimate is outside 21,000 to 1,000,000 — nothing signed
          description: >-
            eth_estimateGas answered a value the service does not believe for a
            sweep, payout, refund or cold transfer (leg="token") or for the fuel
            of a deposit (leg="fuel"). Nothing was signed; the backend keeps the
            row PENDING and asks again every minute. Check the token contract
            (an upgrade or a gas-heavy change), the RPC provider's answer and the
            network's gas tariff before anything else (DEPLOY_RUNBOOK §J
            "Gas tahmini").

      # T172b (proje sahibi kararı 2026-10-23, ⚠ PARA) — the TRON signer refused
      # a deposit refund under its own 24-hour deposit refund cap (DEPOSIT_REFUND_DAILY_LIMIT_USDT).
      # The backend's T169a limit should have held it first, so a refusal
      # here means the two disagree: an admin release above the cap, a
      # single refund larger than the cap, an unset cap / unusable ledger, or
      # a backend asking for more than it should. Every refused attempt counts
      # (the backend asks again every minute), so the rule fires while it lasts.
      - uid: tron-deposit-refund-limit-refused
        title: TRON Signer Refused A Deposit Refund (24h Cap)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(skinora_blockchain_deposit_refund_limit_refusals_total[1h])) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 0m
        labels:
          severity: critical
          category: money
        annotations:
          summary: The TRON signer refused a deposit refund under its 24-hour cap — the refund waits
          description: >-
            Nothing was signed and nothing spent; the backend keeps the refund
            row PENDING (no retry spent) and asks again every minute. Read the
            refusal reason on the series (DEPOSIT_REFUND_DAILY_LIMIT_EXCEEDED /
            DEPOSIT_REFUND_LIMIT_NOT_CONFIGURED / DEPOSIT_REFUND_LEDGER_UNAVAILABLE),
            compare with the backend's held refunds, and follow DEPLOY_RUNBOOK
            §D "Depozitten iade tavanı (imza servisi)" — never raise DEPOSIT_REFUND_DAILY_LIMIT_USDT
            before the refunds counted in the last 24 hours are accounted for.

      # T172b (proje sahibi kararı 2026-10-23, ⚠ PARA) — the Ethereum signer refused
      # a deposit refund under its own 24-hour deposit refund cap (ETHEREUM_DEPOSIT_REFUND_DAILY_LIMIT_USDT).
      # The backend's T169a limit should have held it first, so a refusal
      # here means the two disagree: an admin release above the cap, a
      # single refund larger than the cap, an unset cap / unusable ledger, or
      # a backend asking for more than it should. Every refused attempt counts
      # (the backend asks again every minute), so the rule fires while it lasts.
      - uid: ethereum-deposit-refund-limit-refused
        title: Ethereum Signer Refused A Deposit Refund (24h Cap)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(skinora_ethereum_deposit_refund_limit_refusals_total[1h])) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 0m
        labels:
          severity: critical
          category: money
        annotations:
          summary: The Ethereum signer refused a deposit refund under its 24-hour cap — the refund waits
          description: >-
            Nothing was signed and nothing spent; the backend keeps the refund
            row PENDING (no retry spent) and asks again every minute. Read the
            refusal reason on the series (DEPOSIT_REFUND_DAILY_LIMIT_EXCEEDED /
            DEPOSIT_REFUND_LIMIT_NOT_CONFIGURED),
            compare with the backend's held refunds, and follow DEPLOY_RUNBOOK
            §D "Depozitten iade tavanı (imza servisi)" — never raise ETHEREUM_DEPOSIT_REFUND_DAILY_LIMIT_USDT
            before the refunds counted in the last 24 hours are accounted for.

      # T164 — SQL Server Express caps one database's data files at 10 GB; past
      # it every INSERT that needs a new page fails (Msg 1105 / 1827) — sales,
      # payments, the job storage. The backend publishes the used space and
      # the limit (10240 MB on Express; DatabaseStorageMonitor__DataLimitMegabytes
      # overrides); no limit series = not Express = no alarm.
      - uid: db-data-size-critical
        title: Database Data Files Above 85% Of The Express Limit
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: (max(skinora_backend_db_data_used_bytes) / max(skinora_backend_db_data_limit_bytes)) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.85]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The database uses more than 85% of the SQL Server Express 10 GB data limit
          description: >-
            Space used in the data files of the Skinora database is above 85% of
            the limit the backend publishes (skinora_backend_db_data_limit_bytes —
            10240 MB on Express). At 100% writes fail and the platform stops
            taking sales and payments. Act now: purge what the retention jobs
            allow, move to a paid edition, or archive (DEPLOY_RUNBOOK §N.5).

      # T164 — the newest scheduled full backup (msdb, copy-only excluded) is
      # older than the threshold the backend publishes (default 26 h = the 24 h
      # schedule + 2 h). A database never backed up reads as timestamp 0 and
      # fires too.
      - uid: db-backup-full-stale
        title: No Recent Full Database Backup
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: ((time() - max by (type) (skinora_backend_db_last_backup_timestamp_seconds{type="full"})) / max by (type) (skinora_backend_db_backup_alarm_age_seconds{type="full"})) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The database has no full backup newer than the alarm threshold
          description: >-
            The newest scheduled full backup of the Skinora database finished
            longer ago than DatabaseStorageMonitor__FullBackupMaxAgeHours (default
            26 h), or there is none. Check the skinora-db-backup container (docker
            compose logs skinora-db-backup — "FAILED" lines), the backup folder
            on the host (disk full, permissions) and that the database is ONLINE
            (DEPLOY_RUNBOOK §N).

      # T164 düzeltme turu (S3 F4) — the size and backup rules above end in
      # "or vector(0)": a series that is never published keeps them silent. A
      # backend restarted without read access to msdb (or with the database
      # unreachable) never publishes a backup timestamp at all. The backend
      # publishes skinora_backend_db_probe_success{part} on every reading,
      # failed ones included; a part not read once in 15 minutes fires here.
      # A backend that is down publishes nothing: backend-down covers that.
      - uid: db-monitor-probe-failing
        title: Database Size And Backup Readings Failing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: (1 - max by (part) (max_over_time(skinora_backend_db_probe_success[15m]))) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The backend cannot read the database size or the backup history — the backup and 10 GB alarms are blind
          description: >-
            For 15 minutes every reading of one part (the alert's part label) failed
            (part=storage: sys.database_files on the Skinora database;
            part=backup_history: msdb.dbo.backupset). Until it reads again,
            db-backup-full-stale, db-backup-log-stale and the 10 GB alarms
            cannot fire. Check the backend log ("Database storage reading
            failed"), that the database is ONLINE, and that the backend's login
            can read msdb (sa can; another login needs SELECT on
            msdb.dbo.backupset). DEPLOY_RUNBOOK §N.5.

  - orgId: 1
    name: Skinora Warning Alerts
    folder: Skinora Alerts
    interval: 2m
    rules:
      - uid: high-error-rate-backend
        title: High Error Rate — Backend
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                (
                  sum(rate(http_requests_received_total{code=~"5.."}[5m]))
                  /
                  sum(rate(http_requests_received_total[5m]))
                ) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Backend error rate above 5%
          description: The backend 5xx error rate has exceeded 5% for the last 5 minutes.

      - uid: high-response-time-backend
        title: High Response Time — Backend
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Backend p95 response time above 2s
          description: The backend p95 response time has exceeded 2 seconds for the last 5 minutes.

      - uid: steam-api-errors-high
        title: High Steam API Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(rate(skinora_steam_api_errors_total[5m])) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.1]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Steam API error rate elevated
          description: Steam API errors are occurring at more than 0.1/s for the last 5 minutes.

      - uid: tron-api-errors-high
        title: High TronGrid API Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(rate(skinora_blockchain_tron_api_errors_total[5m])) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.1]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 5m
        labels:
          severity: warning
          category: money
        annotations:
          summary: TronGrid API error rate elevated
          description: TronGrid API errors are occurring at more than 0.1/s for the last 5 minutes.

      # T139 — TronGrid kota reddi (DEFERRED_BACKLOG → T139-ActiveMonitorQuotaAlarm).
      #
      # Neden bu kural var: D3 ödeme penceresini sweep'e kadar açık tutuyor ve
      # sweep `payout_settlement_days`'in 7 günlük sert tabanından önce
      # kuyruklanamıyor, dolayısıyla eşzamanlı izleyici sayısı iki saatlik değil
      # BİR HAFTALIK işlem hacmiyle ölçekleniyor (08 §3.4, T139 doğrulaması N1).
      # Her izleyici TronGrid'e sorgu üretiyor — ödeme beklenirken her tick'te
      # (3 sn), ödeme onaylandıktan sonra 15 dk'da bir (2026-10-02'den beri) —,
      # yani istek hacmi izleyici sayısıyla doğrusal artıyor.
      #
      # Neden eşik "izleyici sayısı" DEĞİL: sayı eşiği ancak sağlayıcının istek
      # bütçesi bilinirse yazılabilir ve TronGrid bu bütçeyi yanıt başlığında
      # DÖNDÜRMÜYOR (2026-08-29'da canlı ölçüldü: Nile 200 dönüyor, rate/quota
      # başlığı yok). Bütçeyi varsaymak, ölçülmemiş bir sayıyla kurulmuş sahte
      # bir bekçi olurdu — bu projenin tekrar eden kusur ailesi. Bunun yerine
      # kural, kotanın DOLDUĞUNU doğrudan gözleyen sinyale bağlandı: TronGrid'in
      # kendi 429'u. ÖNLEYİCİ yarı 2026-10-02'de aşağıdaki
      # `tron-quota-projection` kuralı olarak eklendi: ölçülen istek hızını,
      # izleyici sayısını değil, planın yapılandırılmış bütçesiyle karşılaştırır.
      #
      # `skinora_blockchain_active_monitors` gauge'u bu kuralın sayısal
      # bağlamıdır (integration-metrics paneli çiziyor): alarm ateşlediğinde
      # bakılacak ilk yer o paneldir.
      - uid: tron-quota-rejections
        title: TronGrid Quota Rejections
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # `or vector(0)`: sayaç hiç artmadıysa seri YOKTUR ve kural
              # NoData'ya düşer — "hiç 429 yok" ile "metrik hiç gelmiyor" aynı
              # görünür. Sıfır serisi kuralı gerçekten değerlendirilebilir yapar;
              # exporter'ın kendisi düşerse `blockchain-sidecar-down` yakalar.
              expr: sum(rate(skinora_blockchain_tron_api_errors_total{error_type="http_429"}[5m])) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 2m
        labels:
          severity: critical
          category: money
        annotations:
          summary: TronGrid is rejecting requests with 429 (quota)
          description: >-
            The blockchain sidecar has been receiving HTTP 429 from TronGrid for
            more than 2 minutes. Payment detection polls every 3s per address
            awaiting payment and every 15 min per address in its settlement
            window, so quota exhaustion silently delays or stops deposit
            detection. Check skinora_blockchain_active_monitors for the current
            concurrent-monitor count and the TronGrid plan's request budget.

      # T139-ActiveMonitorQuotaAlarm — ÖNLEYİCİ yarı (proje sahibi kararı
      # 2026-10-02). Ölçülen TronGrid istek hızı (son 1 saatin ortalaması, güne
      # çevrilmiş) yapılandırılmış günlük bütçenin %80'ini geçerse uyarır — kota
      # dolmadan, 429'lar başlamadan önce.
      #
      # Bütçe varsayılmıyor: sidecar `TRONGRID_DAILY_REQUEST_BUDGET`'ı açılışta
      # `skinora_blockchain_trongrid_daily_request_budget` gauge'una yazıyor
      # (geçersiz değerle açılmıyor). TronGrid bütçeyi ne yanıtta ne belgede
      # veriyor; varsayılan 100.000 2026'da raporlanan ücretsiz plan, gerçek
      # planın değeri DEPLOY_RUNBOOK §B'ye göre girilir.
      #
      # Sayılan: TronGridClient (izleme listeleri + kesinlik) ve fetch tabanlı
      # probların hepsi (gas tahmini, devretme planı, transfer durumu). TronWeb'in
      # kendi kurduğu yayın çağrıları sayılmıyor — giden transfer başına birkaç
      # istek, %20'lik boşluğun içinde.
      #
      # Neden 1 saatlik pencere: izleyici sayısı saatler içinde değil günler
      # içinde değişir (adresler ~8 gün açık kalır, 08 §3.4); 1 saat, ödeme
      # bekleyen kısa patlamaları ortalamaya katıp günlük gidişi gösterir.
      - uid: tron-quota-projection
        title: TronGrid Daily Quota Projection
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              # Oran: günlük istek gidişi / günlük bütçe. `or vector(0)`: sayaç
              # henüz yoksa seri olmaz ve kural NoData'ya düşerdi; sidecar
              # tamamen düşerse `blockchain-sidecar-down` yakalar.
              expr: (sum(rate(skinora_blockchain_tron_api_request_duration_seconds_count[1h])) * 86400 / max(skinora_blockchain_trongrid_daily_request_budget)) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 15m
        labels:
          severity: warning
          category: money
        annotations:
          summary: TronGrid requests are on course to use 80% of the daily quota
          description: >-
            Over the last hour the blockchain sidecar's TronGrid request rate,
            projected to a full day, exceeds 80% of the configured daily budget
            (skinora_blockchain_trongrid_daily_request_budget). When the quota
            runs out TronGrid answers 429 and deposit detection slows or stops.
            Check skinora_blockchain_active_monitors and the per-endpoint rate,
            then raise the plan (and TRONGRID_DAILY_REQUEST_BUDGET) or lengthen
            PAYMENT_HOLDING_POLLING_INTERVAL_MS (DEPLOY_RUNBOOK §B, §D).

      # T151 (08 §3.7.4 "Yerel ETH") — bir depozite yakıt olmayan ETH geldi.
      # Transfer log'u olmadığı için yalnız bakiye mutabakatı görür; otomatik
      # iade yok, karar admin'in.
      - uid: ethereum-deposit-native-eth
        title: Native ETH On An Ethereum Deposit
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(skinora_ethereum_native_eth_received_total[2h])) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 0s
        labels:
          severity: warning
          category: money
        annotations:
          summary: Native ETH reached an Ethereum deposit and is not fuel
          description: >-
            The hourly reconciliation saw a deposit's ETH balance rise by more than
            the fuel the fuel wallet recorded for those blocks. An ETH payment
            leaves no Transfer log, so nothing reached the backend and nothing is
            refunded automatically (08 §3.7.4). The Ethereum service's error log
            names the deposit, the transaction and the amount in wei.

      # T151 (08 §3.7.4) — mutabakat sessiz kalmaz: `finalized` 25 dakikadan
      # eskiyse (arşiv derinliği) ya da okuma düşerse tur atlanır ve sayılır;
      # 2,5 aralık boyunca hiç tur tamamlanmazsa bu kural çalar.
      - uid: ethereum-reconciliation-stale
        title: Ethereum Reconciliation Not Running
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: ((time() - max(skinora_ethereum_reconciliation_last_success_timestamp_seconds)) / max(skinora_ethereum_reconciliation_interval_seconds)) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [2.5]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 10m
        labels:
          severity: warning
          category: money
        annotations:
          summary: The Ethereum balance reconciliation has not completed for 2.5 intervals
          description: >-
            No reconciliation round finished for more than 2.5 times
            ETHEREUM_RECONCILIATION_INTERVAL_MS. Rounds are skipped — and counted in
            skinora_ethereum_reconciliation_skipped_total{reason} — when the
            finalized block is older than 25 min (reading state that deep may need
            archive access: 2 RU per request on Chainstack, impossible on
            PublicNode) or when a balance read fails. Missed payments are not
            caught by the second path meanwhile.

      # T152 — 08 §3.7.7 "Bekle" eşiği (3 sa, öneriyle kaydedildi — ⚠): an
      # Ethereum sweep / payout / cold transfer kept unsigned by the fee cap (or a
      # missing ETH price), or a signed one not yet in a block, for longer than
      # the threshold the service publishes (ETHEREUM_FEE_CAP_WAIT_ALARM_SECONDS,
      # parity with blockchain.ethereum.fee_cap_wait_alarm_minutes).
      - uid: ethereum-transfer-wait
        title: Ethereum Send Waiting Too Long
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (max(skinora_ethereum_transfer_wait_seconds{kind=~"fee_cap|unmined"}) / max(skinora_ethereum_transfer_wait_alarm_seconds)) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 2m
        labels:
          severity: warning
          category: money
        annotations:
          summary: An Ethereum send has waited longer than the fee-cap wait threshold
          description: >-
            An Ethereum sweep, payout or cold transfer has not been signed for
            longer than the threshold (3 h by default) because the network fee
            is above the platform's cap, no ETH price is available or its gas
            could not be estimated (GAS_ESTIMATE_UNAVAILABLE /
            GAS_ESTIMATE_ABNORMAL, T159a) — or a
            signed send has not been mined for that long (08 §3.7.7). The
            payout of a waiting sweep waits too. Check the base fee, the ETH
            price source, skinora_ethereum_transfer_wait_seconds by kind and
            the blockchain.ethereum.fee_cap_usd_per_transfer setting
            (DEPLOY_RUNBOOK §D).

      # T153 — 08 §3.7.5 (T142: 0,06 ETH, öneriyle kaydedildi — ⚠): the fuel
      # wallet (gas for every deposit's sweep / refund) or the hot wallet (gas
      # for payouts and cold transfers) holds less ETH than the floor the
      # service publishes next to it (ETHEREUM_FUEL_WALLET_MIN_ETH /
      # ETHEREUM_HOT_WALLET_MIN_ETH, parity with the backend's
      # blockchain.ethereum.{fuel,hot}_wallet_eth_balance_minimum). A wallet
      # without a mounted key publishes no series and stays quiet.
      - uid: ethereum-wallet-eth-low
        title: Ethereum Platform Wallet ETH Low
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: (min by (wallet) (skinora_ethereum_wallet_eth_balance) / min by (wallet) (skinora_ethereum_wallet_eth_floor)) or vector(1)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 10m
        labels:
          severity: warning
          category: money
        annotations:
          summary: An Ethereum platform wallet holds less ETH than its floor
          description: >-
            The fuel wallet (label wallet="fuel") or the hot wallet
            (wallet="hot") is below its ETH floor (0.06 ETH by default — seven
            days of peak sweep fuel at the fee cap plus one crash-day refund,
            08 §3.7.5). Below it, deposits are not fuelled (FUEL_WALLET_LOW) or
            payouts wait (HOT_WALLET_GAS_LOW) — nothing is lost, sends wait.
            Top the wallet up by hand from the operator's wallet
            (DEPLOY_RUNBOOK §D "Yakıt ve sıcak cüzdan ETH'si").

      # T152 düzeltme turu (proje sahibi kararı 2026-10-18): an Ethereum outbound
      # row is never FAILED for a transient error — it keeps retrying with the
      # same id. A stalled network is therefore seen here, per network (not per
      # row): the oldest PENDING outbound row against the threshold the backend
      # publishes next to it (blockchain.ethereum.fee_cap_wait_alarm_minutes × 60,
      # the same 3 h as ethereum-transfer-wait). TRON publishes no threshold, so
      # the division has no TRON series.
      - uid: outbound-transfer-stuck
        title: Outbound Transfers Stuck On A Network
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (max by (network) (skinora_backend_outbound_pending_oldest_seconds) / max by (network) (skinora_backend_outbound_pending_alarm_seconds)) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 5m
        labels:
          severity: warning
          category: money
        annotations:
          summary: Outbound transfers have been waiting PENDING longer than the network's threshold
          description: >-
            The oldest PENDING outbound transfer (payout, refund or sweep) on a
            network has waited longer than its threshold (Ethereum: 3 h). On
            Ethereum such rows are never failed for a transient error — they
            keep retrying with the same id, so a dead or misbehaving Ethereum
            service, a fee above the cap or a missing ETH price shows up here.
            Check skinora_backend_outbound_pending_rows by network, the
            Ethereum service's /health and skinora_ethereum_transfer_wait_seconds
            (DEPLOY_RUNBOOK §D "Ethereum gönderim günlüğü").

      # T158 — "RPC gecikmesi" alarmı (11 T158 temel kriter). Bound from 08
      # §3.7.4: a healthy eth_getLogs / eth_call answers in well under a second;
      # 3 s p95 over 15 min is a provider problem, not a burst.
      - uid: ethereum-rpc-latency-high
        title: Ethereum RPC Latency High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, sum by (le) (rate(skinora_ethereum_rpc_request_duration_seconds_bucket[10m]))) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 15m
        labels:
          severity: warning
          category: money
        annotations:
          summary: The Ethereum service's JSON-RPC calls are slow (p95 above 3 s)
          description: >-
            The 95th percentile of the Ethereum service's JSON-RPC requests (every
            provider, method and outcome) has been above 3 seconds for 15 minutes.
            Slow reads stretch the monitor's catch-up, the hourly reconciliation and
            the backend's 10-second balance chunks (reconciliation-network-failed),
            and sends wait longer. Check the providers' status pages and
            skinora_ethereum_rpc_failover_total; switch ETHEREUM_RPC_PRIMARY_URL if
            one provider stays slow (DEPLOY_RUNBOOK §J).

      # T158 (a) — 11 §F8 T150 doğrulamasından: per network, the row count against
      # the threshold published next to it (same pattern as outbound-transfer-stuck).
      - uid: outbound-transfer-backlog
        title: Outbound Transfers Piling Up On A Network
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (max by (network) (skinora_backend_outbound_pending_rows) / max by (network) (skinora_backend_outbound_pending_rows_alarm_threshold)) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 15m
        labels:
          severity: warning
          category: money
        annotations:
          summary: More PENDING outbound transfers wait on a network than its threshold
          description: >-
            The number of PENDING outbound rows (payouts, refunds, sweeps) on a
            network has been above the threshold the backend publishes
            (OutboundQueueAlarm__PendingRowsThreshold, default 25 — more than a
            dispatcher batch) for 15 minutes. During an outage rows pile up PENDING
            (Ethereum rows never fail on a transient error); this sees it before
            the oldest row reaches outbound-transfer-stuck, and on TRON, which has
            no age threshold. Check the network's service /health and the
            dispatcher log (DEPLOY_RUNBOOK §J).

      # T158 (i) — 11 §F8 T151 doğrulamasından: a failed round used to be only a
      # warning log line. The gauge is published after each round; a backend
      # restart clears it until the next round.
      - uid: reconciliation-network-failed
        title: Ledger Reconciliation Round Failed On A Network
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (max by (network) (skinora_backend_reconciliation_last_run_failed)) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 0m
        labels:
          severity: warning
          category: money
        annotations:
          summary: A network's ledger reconciliation round could not read its balances
          description: >-
            The backend's last reconciliation round of a network (label network)
            aborted because the network's service could not answer the balance
            snapshot — its books were not checked this round. The alarm clears when a
            later round of that network completes (the round runs on
            reconciliation.schedule_cron). On Ethereum the snapshot is read in chunks
            of 20 addresses under the 10-second client timeout; a slow provider
            (ethereum-rpc-latency-high) or the service being down shows up here
            (DEPLOY_RUNBOOK §J).

      - uid: gas-fee-fallback-charged
        title: Gas Fee Charged Without A Live Estimate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: (sum by (network, flow, basis) (increase(skinora_backend_gas_fee_fallback_charged_total[1h]))) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 0m
        labels:
          severity: warning
          category: money
        annotations:
          summary: A refund deduction or payout split was priced without a live gas estimate
          description: >-
            The backend could not get the network's gas estimate (after three tries
            within 12 s for a refund — T160b), refused one above
            max_charged_gas_fee_usdt, or had no deposit address to price, and wrote the
            fee from its fallback instead. Labels: network; flow (refund, hot-wallet
            refund, payout); basis (measured = the last estimate of the same kind,
            at most 6 h old, charged because it was below the setting; static =
            the blockchain.*_gas_fee_estimate_usdt setting: no fresh measurement,
            or one at or above it — the fallback is min(measured, setting)). The amount is fixed on the row and not corrected later
            (08 §3.1a): check the service's estimate-fee log and the RPC provider,
            and compare the row's GasFee with the realized fee (DEPLOY_RUNBOOK §J
            "Gas tahmini"). The alarm clears an hour after the last fallback.

      # T164 — 70% of the Express data limit: weeks of headroom at the trial's
      # volume; time to plan, not to act (the 85% critical rule is the act-now).
      - uid: db-data-size-warning
        title: Database Data Files Above 70% Of The Express Limit
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: (max(skinora_backend_db_data_used_bytes) / max(skinora_backend_db_data_limit_bytes)) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.7]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The database uses more than 70% of the SQL Server Express 10 GB data limit
          description: >-
            Space used in the data files of the Skinora database is above 70% of
            the limit the backend publishes (10240 MB on Express). Plan the next
            step before 85% (db-data-size-critical): which tables grow
            (sp_spaceused), retention, a paid edition or archiving
            (DEPLOY_RUNBOOK §N.5).

      # T164 — only while the database is in FULL recovery: there the
      # transaction log grows until a log backup truncates it, and the log
      # backups are what a point-in-time restore replays.
      - uid: db-backup-log-stale
        title: No Recent Transaction Log Backup
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: (((time() - max by (type) (skinora_backend_db_last_backup_timestamp_seconds{type="log"})) / max by (type) (skinora_backend_db_backup_alarm_age_seconds{type="log"})) and on() (max(skinora_backend_db_recovery_model_full) == 1)) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The database is in FULL recovery but its log has not been backed up recently
          description: >-
            The newest log backup of the Skinora database is older than
            DatabaseStorageMonitor__LogBackupMaxAgeMinutes (default 45 min =
            three missed 15-minute backups), or there is none. Data written since
            the last log backup is not in any backup, and the transaction log
            keeps growing. Check docker compose logs skinora-db-backup
            (DEPLOY_RUNBOOK §N).

      # T169a — deposit refund daily limit (proje sahibi kararı 2026-10-21, ⚠ PARA;
      # 08 §3.3c). The backend's dispatcher publishes, per network, the refunds
      # the limit holds; any held refund pages until it goes (window or AD42).
      - uid: deposit-refund-daily-limit-held
        title: Refund Held By The Deposit Refund Daily Limit
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (max by (network) (skinora_backend_deposit_refund_limit_held_rows)) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 0m
        labels:
          severity: warning
          category: money
        annotations:
          summary: A refund is waiting because deposit refunds reached the network's 24-hour limit
          description: >-
            Refunds that leave deposit addresses on this network have sent
            blockchain.*.deposit_refund_daily_limit_usdt (the admin setting, seeded
            100 USDT; the value in force is skinora_backend_deposit_refund_limit_usdt)
            in the last 24 hours, and the next one would cross it. It waits PENDING (no retry
            spent, never FAILED) and goes out on its own when the refunds of 24
            hours ago leave the window; a refund larger than the limit never does.
            Check skinora_backend_deposit_refund_limit_used_usdt against
            skinora_backend_deposit_refund_limit_usdt, then the admin wallets
            screen ("Günlük iade tavanı"): either wait or release the row (AD42,
            audited) after checking the refund is genuine (DEPLOY_RUNBOOK §M.4).
            An unexpected burst of refunds is the signal this limit exists for.

      # T172a doğrulama S4-4 (⚠ PARA) — the dispatcher's stop switch
      # (outbound.dispatch_paused) left on. It is meant for the post-restore
      # window only (DEPLOY_RUNBOOK §N.8 steps 2–6); forgotten, it holds every
      # payout, refund and sweep on every network. A missing row reads as paused
      # too (a database without the T172a migration).
      - uid: outbound-dispatch-paused
        title: Outgoing Transfers Paused For Over 30 Minutes
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (max(skinora_backend_outbound_dispatch_paused)) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 30m
        labels:
          severity: warning
          category: money
        annotations:
          summary: Every outgoing transfer has been paused for over 30 minutes
          description: >-
            outbound.dispatch_paused has read as paused for 30 minutes: the
            dispatcher sends no payout, refund or sweep on any network (rows stay
            PENDING, no retry spent). It is turned on after a database restore
            (DEPLOY_RUNBOOK §N.8 step 2) and off once every PENDING row is decided
            (step 6). If no restore is under way, check the row: SELECT [Key],
            Value FROM SystemSettings WHERE [Key] = 'outbound.dispatch_paused' —
            'false' sends; any other value, or a missing row (apply the
            migrations), pauses. The backend logs "Outgoing transfers are paused"
            every minute while it lasts.
