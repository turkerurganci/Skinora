# T16 — Grafana Alerting rules (05 §9.3)
# Critical: service down, DB connection lost, blockchain/Steam unreachable
# Warning: error rate high, response time high, disk 80%+, job queue growing
apiVersion: 1

groups:
  - orgId: 1
    name: Skinora Critical Alerts
    folder: Skinora Alerts
    interval: 1m
    rules:
      - uid: backend-down
        title: Backend Service Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="skinora-backend"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Backend service is down
          description: The skinora-backend service has been unreachable for more than 2 minutes.

      - uid: steam-sidecar-down
        title: Steam Sidecar Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="skinora-steam-sidecar"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Steam sidecar is down
          description: The skinora-steam-sidecar service has been unreachable for more than 2 minutes.

      - uid: blockchain-sidecar-down
        title: Blockchain Sidecar Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="skinora-blockchain-sidecar"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Blockchain sidecar is down
          description: The skinora-blockchain-sidecar service has been unreachable for more than 2 minutes.

      # T150 — Ethereum `finalized` stopped advancing (08 §3.7.8; 30 min eşiği
      # T142 ölçümünden: olağan gecikme 12,8–18,8 dk). Eşik tekrarlanmıyor:
      # servis kendi /health'inin uyguladığı eşiği
      # `skinora_ethereum_finalized_stall_threshold_seconds` gauge'una yazıyor
      # (ETHEREUM_FINALIZED_STALL_SECONDS), kural yaşı ona bölüyor — oran > 1.
      # Yaş scrape anında bloğun kendi zaman damgasından hesaplanır; servis
      # başı okuyamıyorsa da yaş büyür. `or vector(0)`: servis kurulu değilken
      # (compose profili "ethereum" kapalı) seri yoktur, kural sessiz kalır.
      - uid: ethereum-finalized-stalled
        title: Ethereum Finality Stalled
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (max(skinora_ethereum_finalized_block_age_seconds) / max(skinora_ethereum_finalized_stall_threshold_seconds)) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Ethereum finalized block is older than the stall threshold
          description: >-
            The last finalized Ethereum block the Ethereum service read is older
            than its stall threshold (ETHEREUM_FINALIZED_STALL_SECONDS, 30 min by
            default; normal finality lag is 13–19 min). No Ethereum payment can
            be accepted while finality is stalled (11 §F8 K5); the service
            reports unhealthy, so the backend freezes Ethereum payment timeouts
            and closes Ethereum for new transactions. TRON is unaffected.
            Check skinora_ethereum_rpc_failover_total and the providers.

      - uid: ethereum-nonce-conflict
        title: Ethereum Send Nonce Used Elsewhere
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(skinora_ethereum_outgoing_nonce_conflicts) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: An Ethereum send's nonce was used by a transaction the service did not sign
          description: >-
            The account nonce of a journalled Ethereum send (payout, refund,
            sweep or cold transfer) moved past it while none of its signed
            attempts is on chain (08 §3.7.6). Something outside the Ethereum
            service signed with that key — a compromised key or a manual send.
            Nothing is re-signed automatically; the backend row stays DETECTED
            and its status answers 409 TRANSFER_NONCE_CONFLICT. Stop the
            service, check the account's transactions on Etherscan and the
            journal (DEPLOY_RUNBOOK §D) before anything is re-sent.

  - orgId: 1
    name: Skinora Warning Alerts
    folder: Skinora Alerts
    interval: 2m
    rules:
      - uid: high-error-rate-backend
        title: High Error Rate — Backend
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                (
                  sum(rate(http_requests_received_total{code=~"5.."}[5m]))
                  /
                  sum(rate(http_requests_received_total[5m]))
                ) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Backend error rate above 5%
          description: The backend 5xx error rate has exceeded 5% for the last 5 minutes.

      - uid: high-response-time-backend
        title: High Response Time — Backend
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Backend p95 response time above 2s
          description: The backend p95 response time has exceeded 2 seconds for the last 5 minutes.

      - uid: steam-api-errors-high
        title: High Steam API Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(rate(skinora_steam_api_errors_total[5m])) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.1]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Steam API error rate elevated
          description: Steam API errors are occurring at more than 0.1/s for the last 5 minutes.

      - uid: tron-api-errors-high
        title: High TronGrid API Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(rate(skinora_blockchain_tron_api_errors_total[5m])) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.1]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: TronGrid API error rate elevated
          description: TronGrid API errors are occurring at more than 0.1/s for the last 5 minutes.

      # T139 — TronGrid kota reddi (DEFERRED_BACKLOG → T139-ActiveMonitorQuotaAlarm).
      #
      # Neden bu kural var: D3 ödeme penceresini sweep'e kadar açık tutuyor ve
      # sweep `payout_settlement_days`'in 7 günlük sert tabanından önce
      # kuyruklanamıyor, dolayısıyla eşzamanlı izleyici sayısı iki saatlik değil
      # BİR HAFTALIK işlem hacmiyle ölçekleniyor (08 §3.4, T139 doğrulaması N1).
      # Her izleyici TronGrid'e sorgu üretiyor — ödeme beklenirken her tick'te
      # (3 sn), ödeme onaylandıktan sonra 15 dk'da bir (2026-10-02'den beri) —,
      # yani istek hacmi izleyici sayısıyla doğrusal artıyor.
      #
      # Neden eşik "izleyici sayısı" DEĞİL: sayı eşiği ancak sağlayıcının istek
      # bütçesi bilinirse yazılabilir ve TronGrid bu bütçeyi yanıt başlığında
      # DÖNDÜRMÜYOR (2026-08-29'da canlı ölçüldü: Nile 200 dönüyor, rate/quota
      # başlığı yok). Bütçeyi varsaymak, ölçülmemiş bir sayıyla kurulmuş sahte
      # bir bekçi olurdu — bu projenin tekrar eden kusur ailesi. Bunun yerine
      # kural, kotanın DOLDUĞUNU doğrudan gözleyen sinyale bağlandı: TronGrid'in
      # kendi 429'u. ÖNLEYİCİ yarı 2026-10-02'de aşağıdaki
      # `tron-quota-projection` kuralı olarak eklendi: ölçülen istek hızını,
      # izleyici sayısını değil, planın yapılandırılmış bütçesiyle karşılaştırır.
      #
      # `skinora_blockchain_active_monitors` gauge'u bu kuralın sayısal
      # bağlamıdır (integration-metrics paneli çiziyor): alarm ateşlediğinde
      # bakılacak ilk yer o paneldir.
      - uid: tron-quota-rejections
        title: TronGrid Quota Rejections
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # `or vector(0)`: sayaç hiç artmadıysa seri YOKTUR ve kural
              # NoData'ya düşer — "hiç 429 yok" ile "metrik hiç gelmiyor" aynı
              # görünür. Sıfır serisi kuralı gerçekten değerlendirilebilir yapar;
              # exporter'ın kendisi düşerse `blockchain-sidecar-down` yakalar.
              expr: sum(rate(skinora_blockchain_tron_api_errors_total{error_type="http_429"}[5m])) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: TronGrid is rejecting requests with 429 (quota)
          description: >-
            The blockchain sidecar has been receiving HTTP 429 from TronGrid for
            more than 2 minutes. Payment detection polls every 3s per address
            awaiting payment and every 15 min per address in its settlement
            window, so quota exhaustion silently delays or stops deposit
            detection. Check skinora_blockchain_active_monitors for the current
            concurrent-monitor count and the TronGrid plan's request budget.

      # T139-ActiveMonitorQuotaAlarm — ÖNLEYİCİ yarı (proje sahibi kararı
      # 2026-10-02). Ölçülen TronGrid istek hızı (son 1 saatin ortalaması, güne
      # çevrilmiş) yapılandırılmış günlük bütçenin %80'ini geçerse uyarır — kota
      # dolmadan, 429'lar başlamadan önce.
      #
      # Bütçe varsayılmıyor: sidecar `TRONGRID_DAILY_REQUEST_BUDGET`'ı açılışta
      # `skinora_blockchain_trongrid_daily_request_budget` gauge'una yazıyor
      # (geçersiz değerle açılmıyor). TronGrid bütçeyi ne yanıtta ne belgede
      # veriyor; varsayılan 100.000 2026'da raporlanan ücretsiz plan, gerçek
      # planın değeri DEPLOY_RUNBOOK §B'ye göre girilir.
      #
      # Sayılan: TronGridClient (izleme listeleri + kesinlik) ve fetch tabanlı
      # probların hepsi (gas tahmini, devretme planı, transfer durumu). TronWeb'in
      # kendi kurduğu yayın çağrıları sayılmıyor — giden transfer başına birkaç
      # istek, %20'lik boşluğun içinde.
      #
      # Neden 1 saatlik pencere: izleyici sayısı saatler içinde değil günler
      # içinde değişir (adresler ~8 gün açık kalır, 08 §3.4); 1 saat, ödeme
      # bekleyen kısa patlamaları ortalamaya katıp günlük gidişi gösterir.
      - uid: tron-quota-projection
        title: TronGrid Daily Quota Projection
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              # Oran: günlük istek gidişi / günlük bütçe. `or vector(0)`: sayaç
              # henüz yoksa seri olmaz ve kural NoData'ya düşerdi; sidecar
              # tamamen düşerse `blockchain-sidecar-down` yakalar.
              expr: (sum(rate(skinora_blockchain_tron_api_request_duration_seconds_count[1h])) * 86400 / max(skinora_blockchain_trongrid_daily_request_budget)) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: TronGrid requests are on course to use 80% of the daily quota
          description: >-
            Over the last hour the blockchain sidecar's TronGrid request rate,
            projected to a full day, exceeds 80% of the configured daily budget
            (skinora_blockchain_trongrid_daily_request_budget). When the quota
            runs out TronGrid answers 429 and deposit detection slows or stops.
            Check skinora_blockchain_active_monitors and the per-endpoint rate,
            then raise the plan (and TRONGRID_DAILY_REQUEST_BUDGET) or lengthen
            PAYMENT_HOLDING_POLLING_INTERVAL_MS (DEPLOY_RUNBOOK §B, §D).

      # T152 — 08 §3.7.7 "Bekle" eşiği (3 sa, öneriyle kaydedildi — ⚠): an
      # Ethereum sweep / payout / cold transfer kept unsigned by the fee cap (or a
      # missing ETH price), or a signed one not yet in a block, for longer than
      # the threshold the service publishes (ETHEREUM_FEE_CAP_WAIT_ALARM_SECONDS,
      # parity with blockchain.ethereum.fee_cap_wait_alarm_minutes).
      - uid: ethereum-transfer-wait
        title: Ethereum Send Waiting Too Long
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (max(skinora_ethereum_transfer_wait_seconds{kind=~"fee_cap|unmined"}) / max(skinora_ethereum_transfer_wait_alarm_seconds)) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: An Ethereum send has waited longer than the fee-cap wait threshold
          description: >-
            An Ethereum sweep, payout or cold transfer has not been signed for
            longer than the threshold (3 h by default) because the network fee
            is above the platform's cap or no ETH price is available — or a
            signed send has not been mined for that long (08 §3.7.7). The
            payout of a waiting sweep waits too. Check the base fee, the ETH
            price source, skinora_ethereum_transfer_wait_seconds by kind and
            the blockchain.ethereum.fee_cap_usd_per_transfer setting
            (DEPLOY_RUNBOOK §D).

      # T152 düzeltme turu (proje sahibi kararı 2026-10-18): an Ethereum outbound
      # row is never FAILED for a transient error — it keeps retrying with the
      # same id. A stalled network is therefore seen here, per network (not per
      # row): the oldest PENDING outbound row against the threshold the backend
      # publishes next to it (blockchain.ethereum.fee_cap_wait_alarm_minutes × 60,
      # the same 3 h as ethereum-transfer-wait). TRON publishes no threshold, so
      # the division has no TRON series.
      - uid: outbound-transfer-stuck
        title: Outbound Transfers Stuck On A Network
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (max by (network) (skinora_backend_outbound_pending_oldest_seconds) / max by (network) (skinora_backend_outbound_pending_alarm_seconds)) or vector(0)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Outbound transfers have been waiting PENDING longer than the network's threshold
          description: >-
            The oldest PENDING outbound transfer (payout, refund or sweep) on a
            network has waited longer than its threshold (Ethereum: 3 h). On
            Ethereum such rows are never failed for a transient error — they
            keep retrying with the same id, so a dead or misbehaving Ethereum
            service, a fee above the cap or a missing ETH price shows up here.
            Check skinora_backend_outbound_pending_rows by network, the
            Ethereum service's /health and skinora_ethereum_transfer_wait_seconds
            (DEPLOY_RUNBOOK §D "Ethereum gönderim günlüğü").
