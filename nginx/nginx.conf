worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;

    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # T166 — country header trust (geo-block, 02 §21.1).
    #
    # Deneme yayını topolojisi: Cloudflare Tunnel (cloudflared) -> nginx ->
    # backend. Cloudflare writes CF-IPCountry on every request it forwards and
    # overwrites any value a client sent, so that header is trustworthy ONLY
    # when nginx's own TCP peer is the tunnel connector. Any other peer (a
    # client hitting a published port directly) could have written it.
    #
    # $skinora_trusted_edge = 1 only for the connector's address. The default
    # trusts the compose network (the same range as the backend's
    # REVERSE_PROXY_KNOWN_NETWORK default) MINUS its gateway: with Docker's
    # userland proxy (Docker Desktop, localhost traffic) a request to a
    # published port reaches nginx FROM the gateway address, so the gateway
    # must never count as the edge. If the network gets a different subnet
    # nothing matches and the country simply falls back to the backend's
    # IP-based lookup — "missing information", never "misplaced trust".
    # T162: pin this to the cloudflared container (DEPLOY_RUNBOOK §B).
    geo $skinora_trusted_edge {
        default        0;
        172.20.0.0/16  1;
        172.20.0.1/32  0;
    }

    # X-Country-Code sent to the backend: Cloudflare's value from the trusted
    # edge, otherwise EMPTY. proxy_set_header with an empty value drops the
    # header, so a client-supplied X-Country-Code never reaches the backend.
    # The backend additionally believes the header only when its own peer is
    # this nginx (ReverseProxy:KnownNetworks) — see HeaderCountryResolver.
    map $skinora_trusted_edge $skinora_edge_country {
        1       $http_cf_ipcountry;
        default "";
    }

    upstream backend {
        server skinora-backend:5000;
    }

    upstream frontend {
        server skinora-frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # Nginx health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        # API requests
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $request_id;
            # T166 — see $skinora_edge_country above.
            proxy_set_header X-Country-Code $skinora_edge_country;
            proxy_set_header CF-IPCountry "";

            # WebSocket support (for SignalR)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # SignalR hub
        location /hubs/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Country-Code $skinora_edge_country;
            proxy_set_header CF-IPCountry "";

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        # Health endpoint for the outside world (T165). The backend's /health
        # names every dependency check and copies exception messages (a SQL
        # connection error carries a host name) — fine on the compose network,
        # not on the internet. The public /health is therefore answered by the
        # backend's minimal /api/health ({"status":"..."}, 200 / 503, no-store),
        # the same endpoint outside monitors call as https://<domain>/api/health
        # (through the /api/ location above). Exact match: /health/anything
        # falls through to the frontend like any other unknown path. Internal
        # callers (compose healthcheck, Uptime Kuma) keep using
        # http://skinora-backend:5000/health directly.
        location = /health {
            access_log off;
            proxy_pass http://backend/api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Country-Code "";
            proxy_set_header CF-IPCountry "";
        }

        # Frontend (default)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
