worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;

    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # T162 — the Cloudflare tunnel edge.
    #
    # Deneme yayını topolojisi: Cloudflare Tunnel (cloudflared) -> nginx ->
    # backend. TLS ends at Cloudflare; cloudflared talks plain HTTP to nginx
    # over the compose network, so nginx's own TCP peer for every outside
    # request is the connector. Cloudflare writes CF-Connecting-IP (client
    # IP), CF-IPCountry and X-Forwarded-Proto on every request it forwards and
    # overwrites any value a client sent — those headers are trustworthy ONLY
    # when nginx's peer IS the connector. Any other peer (a request to the
    # loopback operator port, another container) could have written them.
    #
    # The connector has a FIXED address: docker-compose.trial.yml pins
    # skinora-cloudflared to 172.30.161.250 (outside the network's dynamic
    # ip_range, so no other container can get it). Only that /32 is trusted —
    # not the whole network: with Docker's userland proxy (Docker Desktop,
    # localhost traffic) a request to a published port reaches nginx FROM the
    # network gateway (measured, T166), and every other container on the
    # network would count as "the edge" too. scripts/compose-exposure.test.mjs
    # fails CI when the compose address and the address below drift apart.
    # On any other network (the development stack, 172.20.0.0/16) nothing
    # matches: no client IP, scheme or country is taken from a header —
    # "missing information", never "misplaced trust".
    #
    # Client IP: realip rewrites $remote_addr to CF-Connecting-IP only for the
    # connector's address (anything else keeps its socket address and its
    # CF-Connecting-IP is ignored). X-Real-IP and X-Forwarded-For below then
    # carry the real client, so the backend (ForwardLimit=1, trusting only the
    # compose network) keys the auth rate limit, geo-block and VPN signal on
    # the visitor, not on the connector (DEPLOY_RUNBOOK §K.5).
    set_real_ip_from 172.30.161.250;
    real_ip_header   CF-Connecting-IP;
    real_ip_recursive off;

    # T166 — $skinora_trusted_edge = 1 only for the connector's SOCKET
    # address. $realip_remote_addr, not $remote_addr: after realip the latter
    # is the visitor's IP, which must never decide trust.
    geo $realip_remote_addr $skinora_trusted_edge {
        default            0;
        172.30.161.250/32  1;
    }

    # T162 — the scheme the backend sees (X-Forwarded-Proto). Behind the
    # tunnel nginx's own $scheme is always http; Cloudflare's value is taken
    # from the connector only. Every other peer gets nginx's $scheme, so a
    # client cannot claim https on the loopback port.
    map "$skinora_trusted_edge:$http_x_forwarded_proto" $skinora_forwarded_proto {
        "1:https" https;
        default   $scheme;
    }

    # A plain-http request that came through Cloudflare is sent to https
    # (the session cookie is Secure; Steam's return_to is https).
    map "$skinora_trusted_edge:$http_x_forwarded_proto" $skinora_edge_plain_http {
        "1:http" 1;
        default  0;
    }

    # X-Country-Code sent to the backend: Cloudflare's value from the trusted
    # edge, otherwise EMPTY. proxy_set_header with an empty value drops the
    # header, so a client-supplied X-Country-Code never reaches the backend.
    # The backend additionally believes the header only when its own peer is
    # this nginx (ReverseProxy:KnownNetworks) — see HeaderCountryResolver.
    map $skinora_trusted_edge $skinora_edge_country {
        1       $http_cf_ipcountry;
        default "";
    }

    upstream backend {
        server skinora-backend:5000;
    }

    upstream frontend {
        server skinora-frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # T162 — see $skinora_edge_plain_http above.
        if ($skinora_edge_plain_http) {
            return 301 https://$host$request_uri;
        }

        # Nginx health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        # API requests
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $skinora_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
            # T166 — see $skinora_edge_country above.
            proxy_set_header X-Country-Code $skinora_edge_country;
            proxy_set_header CF-IPCountry "";

            # WebSocket support (for SignalR)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # SignalR hub
        location /hubs/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $skinora_forwarded_proto;
            proxy_set_header X-Country-Code $skinora_edge_country;
            proxy_set_header CF-IPCountry "";

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        # Health endpoint for the outside world (T165). The backend's /health
        # names every dependency check and copies exception messages (a SQL
        # connection error carries a host name) — fine on the compose network,
        # not on the internet. The public /health is therefore answered by the
        # backend's minimal /api/health ({"status":"..."}, 200 / 503, no-store),
        # the same endpoint outside monitors call as https://<domain>/api/health
        # (through the /api/ location above). Exact match: /health/anything
        # falls through to the frontend like any other unknown path. Internal
        # callers (compose healthcheck, Uptime Kuma) keep using
        # http://skinora-backend:5000/health directly.
        location = /health {
            access_log off;
            proxy_pass http://backend/api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $skinora_forwarded_proto;
            proxy_set_header X-Country-Code "";
            proxy_set_header CF-IPCountry "";
        }

        # Frontend (default)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $skinora_forwarded_proto;
        }
    }
}
