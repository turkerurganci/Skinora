# =============================================================================
# Skinora — E2E stack (T107). SELF-CONTAINED — run standalone, NOT layered over
# docker-compose.yml:
#   docker compose -f docker-compose.e2e.yml up -d --build --wait
#
# Differences from the production stack:
#   * All three real sidecars are replaced by a single `skinora-fake-sidecar`
#     container, aliased to every sidecar hostname so the backend reaches the
#     Steam surface on :5100, the TRON surface on :5200 and (T155) the
#     Ethereum surface on :5300 — the two payment networks of 11 §F8 K1, each
#     answered by its own router, with its own webhook secret.
#   * Steam OAuth + on-chain finality are simulated at the backend webhook/client
#     seam (no real Steam account / Tron node needed).
#   * Observability (loki/prometheus/grafana/uptime-kuma) is omitted for speed.
#
# Schema + happy-path seed are applied by the Playwright harness AFTER the
# backend reports healthy. The seed is users + price cache + the SELLER's fake
# Steam inventory; there is no bot row any more (T117 dropped PlatformSteamBots,
# T137a removed the seed, T137 removed the fake's bot identity).
#
# All secrets below are FIXED TEST VALUES — they are NOT sensitive and exist so
# the harness can mint matching JWTs / sign webhooks. NEVER reuse in production.
#
# T171a — the backend runs as Production, so its shared secrets (JWT, webhook
# secrets, internal keys) can ONLY come from files under /run/secrets
# (SharedSecretFiles; an environment variable stops it). This stack mounts
# them from the inline `configs:` at the end — no host file to create, the
# same file path the real stack's Docker secrets use. The fake sidecar is a
# test double and keeps reading its webhook secrets from the environment.
#
# T171b — the database and Redis run the real stack's entrypoint scripts
# (scripts/db/mssql-entrypoint.sh, scripts/redis/redis-entrypoint.sh) with
# their passwords as files from the same inline `configs:`; the backend's
# connection strings carry no password (it adds the file's). The fake sidecar
# keeps its DB password in the environment (test double).
# =============================================================================
services:
  skinora-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: skinora-e2e-db
    entrypoint: ["/bin/bash", "/opt/skinora/mssql-entrypoint.sh"]
    command: ["/opt/mssql/bin/sqlservr"]
    ports:
      - "${E2E_DB_PORT:-14333}:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD_FILE=/run/secrets/mssql_sa_password
      - MSSQL_PID=Developer
    volumes:
      - ./scripts/db/mssql-entrypoint.sh:/opt/skinora/mssql-entrypoint.sh:ro
    configs:
      - source: e2e_mssql_sa_password
        target: /run/secrets/mssql_sa_password
    healthcheck:
      test: ["CMD", "/bin/bash", "/opt/skinora/mssql-entrypoint.sh", "--healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - skinora-e2e

  skinora-redis:
    image: redis:7-alpine
    container_name: skinora-e2e-redis
    entrypoint: ["/bin/sh", "/opt/skinora/redis-entrypoint.sh"]
    command: ["--appendonly", "no"]
    tmpfs:
      - /run/skinora-redis
    volumes:
      - ./scripts/redis/redis-entrypoint.sh:/opt/skinora/redis-entrypoint.sh:ro
    configs:
      - source: e2e_redis_password
        target: /run/secrets/redis_password
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/skinora/redis-entrypoint.sh", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - skinora-e2e

  skinora-fake-sidecar:
    build:
      context: ./sidecar-fake
      dockerfile: Dockerfile
    container_name: skinora-e2e-fake-sidecar
    ports:
      - "${E2E_STEAM_PORT:-5100}:5100"
      - "${E2E_BLOCKCHAIN_PORT:-5200}:5200"
      - "${E2E_ETHEREUM_PORT:-5300}:5300"
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - BACKEND_URL=http://skinora-backend:5000
      # BLOCKCHAIN_WEBHOOK_SECRET must match the backend's
      # Webhook__BlockchainSharedSecret below. It is the only webhook secret
      # left: T132 removed Webhook__SteamSharedSecret with the inbound Steam
      # webhook route, and T133 removed the sidecar half (STEAM_WEBHOOK_SECRET
      # and the config.ts binding that had no reader).
      - BLOCKCHAIN_WEBHOOK_SECRET=e2e-blockchain-webhook-secret-0123456789-ab
      # T155 — Ethereum's own secret; must match Webhook__EthereumSharedSecret
      # below and must DIFFER from the TRON one (T148: the backend refuses to
      # start when both networks share a secret, and the secret that verifies
      # is what tells it which network is speaking).
      - ETHEREUM_PORT=5300
      - ETHEREUM_WEBHOOK_SECRET=e2e-ethereum-webhook-secret-9876543210-cd
      # INTERNAL_KEY intentionally unset → fake accepts backend calls without
      # X-Internal-Key (avoids a key mismatch failing the surface).
      - DB_SERVER=skinora-db
      - DB_PORT_INTERNAL=1433
      - DB_USER=sa
      - DB_PASSWORD=E2e!Strong!Pass!2345
      - DB_NAME=Skinora
      # T137 — FAKE_BOT_STEAM_ID + FAKE_TRADE_ACCEPT_DELAY_MS were dropped with
      # the fake's custody trade surface: the platform sends no trade offers
      # (02 §2.1), so there is no bot identity and no self-accept delay left.
    depends_on:
      skinora-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5100/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      skinora-e2e:
        # The backend's SteamSidecar/BlockchainSidecar/EthereumSidecar BaseUrl
        # host names resolve to this single container.
        aliases:
          - skinora-steam-sidecar
          - skinora-blockchain-sidecar
          - skinora-ethereum-sidecar

  skinora-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skinora-e2e-backend
    ports:
      - "${E2E_BACKEND_PORT:-5000}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # T171b — no password in either: the backend adds the file's.
      - ConnectionStrings__DefaultConnection=Server=skinora-db,1433;Database=Skinora;User Id=sa;TrustServerCertificate=True;
      - Redis__ConnectionString=skinora-redis:6379
      - Jwt__Issuer=skinora
      - Jwt__Audience=skinora-client
      - Jwt__AccessTokenExpiryMinutes=60
      - SteamSidecar__BaseUrl=http://skinora-steam-sidecar:5100
      - BlockchainSidecar__BaseUrl=http://skinora-blockchain-sidecar:5200
      # T155 — the Ethereum service (T148 per-network contract). Configured =
      # Ethereum is open for new listings (07 §7.4 supportedNetworks) as long
      # as the fake's /health on :5300 declares acceptsPayments (T151). The
      # TRON-default create/accept bodies of the older suites are unaffected.
      - EthereumSidecar__BaseUrl=http://skinora-ethereum-sidecar:5300
      # T109 — tighten the deadline-scanner sweep (default 30s) so the timeout
      # scenarios observe CANCELLED_TIMEOUT quickly after the harness backdates a
      # phase deadline. Infrastructure knob (TimeoutSchedulingOptions), not a
      # business parameter.
      - Timeouts__DeadlineScannerIntervalSeconds=5
      # 19 mandatory SystemSettings (SettingsBootstrapService fail-fast). Short
      # timeouts keep the happy path quick; thresholds permissive so the seeded
      # transaction is not flagged.
      - SKINORA_SETTING_ACCEPT_TIMEOUT_MINUTES=60
      - SKINORA_SETTING_SELLER_CONFIRM_TIMEOUT_MINUTES=60
      - SKINORA_SETTING_PAYMENT_TIMEOUT_MIN_MINUTES=15
      - SKINORA_SETTING_PAYMENT_TIMEOUT_MAX_MINUTES=60
      - SKINORA_SETTING_PAYMENT_TIMEOUT_DEFAULT_MINUTES=30
      - SKINORA_SETTING_DELIVERY_TIMEOUT_MINUTES=60
      - SKINORA_SETTING_MIN_TRANSACTION_AMOUNT=1.0
      - SKINORA_SETTING_MAX_TRANSACTION_AMOUNT=10000.0
      - SKINORA_SETTING_MAX_CONCURRENT_TRANSACTIONS=5
      - SKINORA_SETTING_NEW_ACCOUNT_TRANSACTION_LIMIT=3
      - SKINORA_SETTING_NEW_ACCOUNT_PERIOD_DAYS=14
      - SKINORA_SETTING_CANCEL_LIMIT_COUNT=3
      - SKINORA_SETTING_CANCEL_LIMIT_PERIOD_HOURS=24
      - SKINORA_SETTING_CANCEL_COOLDOWN_HOURS=1
      - SKINORA_SETTING_HIGH_VOLUME_AMOUNT_THRESHOLD=5000.0
      - SKINORA_SETTING_HIGH_VOLUME_COUNT_THRESHOLD=10
      - SKINORA_SETTING_HIGH_VOLUME_PERIOD_HOURS=24
      - SKINORA_SETTING_HOT_WALLET_LIMIT=100000.0
      - SKINORA_SETTING_DORMANT_ACCOUNT_VALUE_THRESHOLD=1000.0
      # Platform wallet addresses (05 §3.3, owner decision 2026-09-16). The e2e
      # stack has no real signer — the fake sidecar signs nothing and pins
      # nothing — but the backend needs the hot wallet address to queue a sweep
      # at all, and since 2026-09-17 the seller payout waits for that sweep to
      # confirm. Without these two the chain stalls at ITEM_DELIVERED.
      - HOT_WALLET_ADDRESS=TE2eHotWa11etFakeAddress2222222222
      - COLD_WALLET_ADDRESS=TE2eCo1dWa11etFakeAddress333333333
      # T155 — Ethereum's platform wallets (T148). Same reason as TRON's: the
      # Ethereum sweep needs its hot wallet, and the Ethereum payout waits for
      # that sweep. Readable placeholders, valid 0x shape, no key behind them.
      - ETHEREUM_HOT_WALLET_ADDRESS=0xe2e0000000000000000000000000000000000002
      - ETHEREUM_COLD_WALLET_ADDRESS=0xe2e0000000000000000000000000000000000003
    # T171a — the shared secrets as files at /run/secrets/<name>, where the
    # real stack mounts its Docker secrets. The notification secrets are not
    # mounted: their channels stay on the logging stub here (blank = default).
    configs:
      - source: e2e_jwt_secret
        target: /run/secrets/jwt_secret
      - source: e2e_blockchain_webhook_secret
        target: /run/secrets/blockchain_webhook_secret
      - source: e2e_ethereum_webhook_secret
        target: /run/secrets/ethereum_webhook_secret
      - source: e2e_steam_sidecar_internal_key
        target: /run/secrets/steam_sidecar_internal_key
      - source: e2e_blockchain_sidecar_internal_key
        target: /run/secrets/blockchain_sidecar_internal_key
      - source: e2e_ethereum_sidecar_internal_key
        target: /run/secrets/ethereum_sidecar_internal_key
      # T171b — the database and Redis passwords, the same values the two
      # containers read.
      - source: e2e_mssql_sa_password
        target: /run/secrets/mssql_sa_password
      - source: e2e_redis_password
        target: /run/secrets/redis_password
    depends_on:
      skinora-db:
        condition: service_healthy
      skinora-redis:
        condition: service_healthy
      skinora-fake-sidecar:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - skinora-e2e

  skinora-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skinora-e2e-frontend
    # NEXT_PUBLIC_API_URL / _SIGNALR_URL are left at their build-time defaults
    # (/api/v1, /hubs) so the browser uses same-origin relative paths proxied by
    # nginx — no rebuild or CORS needed.
    environment:
      - NODE_ENV=production
    depends_on:
      skinora-backend:
        condition: service_healthy
    # node:20-slim has neither wget nor curl — probe with node's global fetch.
    # The frontend's health route is /api/health (Next App Router); plain /health
    # 404s, which would keep this container unhealthy and block nginx from starting.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - skinora-e2e

  skinora-reverse-proxy:
    image: nginx:alpine
    container_name: skinora-e2e-nginx
    # Playwright targets http://localhost:${E2E_HTTP_PORT}. nginx serves the
    # frontend and proxies /api + /hubs (WebSocket) + /health to the backend.
    ports:
      - "${E2E_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      skinora-backend:
        condition: service_healthy
      skinora-frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - skinora-e2e

networks:
  skinora-e2e:
    driver: bridge

# T171a — fixed test values (see the header), mounted as files into the
# backend. The JWT secret must equal e2e/src/config.ts jwtSecret; the two
# webhook secrets must equal the fake sidecar's BLOCKCHAIN_ / ETHEREUM_WEBHOOK_SECRET
# above. Internal keys are >= 32 characters (the backend's floor); the fake
# checks none (INTERNAL_KEY unset).
configs:
  e2e_jwt_secret:
    content: e2e-jwt-secret-do-not-use-in-prod-0123456789
  e2e_blockchain_webhook_secret:
    content: e2e-blockchain-webhook-secret-0123456789-ab
  e2e_ethereum_webhook_secret:
    content: e2e-ethereum-webhook-secret-9876543210-cd
  e2e_steam_sidecar_internal_key:
    content: e2e-steam-internal-key-0123456789-abcdef
  e2e_blockchain_sidecar_internal_key:
    content: e2e-tron-internal-key-0123456789-abcdefg
  e2e_ethereum_sidecar_internal_key:
    content: e2e-ethereum-internal-key-0123456789-abc
  # T171b — the database and Redis passwords (fixed test values). The fake
  # sidecar's DB_PASSWORD above and the Playwright harness use the same one.
  e2e_mssql_sa_password:
    content: E2e!Strong!Pass!2345
  e2e_redis_password:
    content: e2e-redis-pass-123
