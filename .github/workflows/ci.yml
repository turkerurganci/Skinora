name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

# dorny/paths-filter requires pull-requests:read to call the GitHub Files
# API for PR events. contents:read is the default but made explicit here
# so future additions stay least-privilege.
permissions:
  contents: read
  pull-requests: read

# Cancel in-progress runs of the same workflow on the same ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Detect which areas of the repo changed so downstream jobs can skip when
  # a PR only touches docs/memory/markdown. Integration test + migration
  # dry-run + build + unit/contract test all depend on backend source —
  # running them on a pure-docs PR wastes ~25 Linux minutes with zero
  # signal (see 2026-04-19 T26 chore PR chain).
  #
  # `backend` output is true when any tracked file under backend/,
  # frontend/, sidecar-*/, or .github/workflows/ changed. A workflow edit
  # forces a full run because the workflow itself might reshape job graph.
  # ----------------------------------------------------------------------------
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      frontend: ${{ steps.filter.outputs.frontend }}
      sidecar-steam: ${{ steps.filter.outputs['sidecar-steam'] }}
      sidecar-blockchain: ${{ steps.filter.outputs['sidecar-blockchain'] }}
      sidecar-fake: ${{ steps.filter.outputs['sidecar-fake'] }}
      e2e: ${{ steps.filter.outputs.e2e }}
      e2e-stack: ${{ steps.filter.outputs['e2e-stack'] }}
      docker-matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'backend/**'
              - 'frontend/**'
              - 'sidecar-steam/**'
              - 'sidecar-blockchain/**'
              - '.github/workflows/**'
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
            sidecar-steam:
              - 'sidecar-steam/**'
              - '.github/workflows/**'
            sidecar-blockchain:
              - 'sidecar-blockchain/**'
              - '.github/workflows/**'
            sidecar-fake:
              - 'sidecar-fake/**'
              - '.github/workflows/**'
            e2e:
              - 'e2e/**'
              - '.github/workflows/**'
            # T107 E2E smoke (advisory) — runs when the harness, the fake, the
            # compose file, or the services it exercises change.
            e2e-stack:
              - 'e2e/**'
              - 'sidecar-fake/**'
              - 'docker-compose.e2e.yml'
              - 'backend/**'
              - 'frontend/**'
              - '.github/workflows/**'

      # Build a matrix JSON for docker-build-check. Empty array when no
      # image context changed — the docker job then skips entirely
      # instead of rebuilding all four every PR. A workflow edit sets
      # every path filter to true so all four are included (defence:
      # workflow changes might reshape image builds).
      - name: Build docker matrix
        id: build-matrix
        env:
          F_BACKEND: ${{ steps.filter.outputs.backend }}
          F_FRONTEND: ${{ steps.filter.outputs.frontend }}
          F_SIDECAR_STEAM: ${{ steps.filter.outputs['sidecar-steam'] }}
          F_SIDECAR_BLOCKCHAIN: ${{ steps.filter.outputs['sidecar-blockchain'] }}
        run: |
          components=()
          [ "$F_BACKEND" = "true" ]           && components+=('{"name":"backend","context":"backend"}')
          [ "$F_FRONTEND" = "true" ]          && components+=('{"name":"frontend","context":"frontend"}')
          [ "$F_SIDECAR_STEAM" = "true" ]     && components+=('{"name":"sidecar-steam","context":"sidecar-steam"}')
          [ "$F_SIDECAR_BLOCKCHAIN" = "true" ]&& components+=('{"name":"sidecar-blockchain","context":"sidecar-blockchain"}')
          if [ ${#components[@]} -eq 0 ]; then
            matrix='{"component":[]}'
          else
            IFS=,
            matrix="{\"component\":[${components[*]}]}"
          fi
          echo "Matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------------------
  # 0. Guard — direct push detection (defense-in-depth, T11 R3)
  # Sadece push event'lerinde calisir (PR'larda skip).
  # PR squash merge commit mesajlari "(#NN)" icerdiginden otomatik PASS olur.
  # Direct push'lar (hook bypass veya hook kurulu degil) bunu tetikler.
  # [skip-guard] commit mesajinda varsa bypass edilir (acil durum).
  # Bu job FAIL olsa da push zaten gerceklesmistir — amaci: gorunur uyari.
  # ----------------------------------------------------------------------------
  guard-direct-push:
    name: 0. Guard (direct push)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check for PR merge reference
        run: |
          MSG=$(git log -1 --format=%B HEAD)
          echo "Commit message: $MSG"
          echo ""

          if echo "$MSG" | grep -qE '\(#[0-9]+\)'; then
            echo "OK: commit message contains PR reference — squash merge detected."
          elif echo "$MSG" | grep -q '\[skip-guard\]'; then
            echo "::warning title=Guard Bypass::[skip-guard] override detected in commit message."
            echo "This commit was pushed directly to a protected branch without a PR."
          else
            echo "::error title=Direct Push Detected::This commit was pushed directly without a PR merge."
            echo ""
            echo "Discipline-only branch protection rejiminde tum degisiklikler"
            echo "PR + CI uzerinden gitmeli. Direct push tespit edildi."
            echo ""
            echo "Bu hata gorunurluk icindir — push zaten gerceklesti."
            echo "Bir sonraki commit'te bu durumu duzelt veya bypass log'a kaydet."
            echo ""
            echo "Bypass: commit mesajina [skip-guard] ekle (acil durum)."
            exit 1
          fi

  # ----------------------------------------------------------------------------
  # 1. Lint  (09 §21.4 step 1)
  # ----------------------------------------------------------------------------
  lint:
    name: 1. Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: dotnet format (verify backend)
        working-directory: backend
        run: dotnet format Skinora.sln --verify-no-changes --severity error

      - name: Frontend lint
        working-directory: frontend
        run: npm ci && npm run lint

      - name: Frontend format check
        working-directory: frontend
        run: npm run format:check

      - name: Frontend i18n parity check
        working-directory: frontend
        run: npm run i18n:check

      - name: Sidecar-steam typecheck
        working-directory: sidecar-steam
        run: npm ci && npx tsc --noEmit

      - name: Sidecar-steam format check
        working-directory: sidecar-steam
        run: npm run format:check

      - name: Sidecar-blockchain typecheck
        working-directory: sidecar-blockchain
        run: npm ci && npx tsc --noEmit

      - name: Sidecar-blockchain format check
        working-directory: sidecar-blockchain
        run: npm run format:check

      # T107 — fake sidecar (E2E test double) + e2e harness quality gates
      # (validator N1). Blocking like the other sidecars; sidecar-fake also runs
      # its vitest suite in the JS test job.
      - name: Sidecar-fake typecheck + format + lint
        working-directory: sidecar-fake
        run: npm ci && npx tsc --noEmit && npm run format:check && npm run lint

      - name: E2E typecheck + format + lint
        working-directory: e2e
        run: npm ci && npx tsc --noEmit && npm run format:check && npm run lint

      # npm audit — sidecar dependency advisories (WP18). Steam is ADVISORY
      # (continue-on-error) permanently: it carries upstream-unfixable transitive
      # criticals (request@2.88.2 / protobufjs) whose only npm "fix" is a
      # destructive steam-user downgrade (owner accept-risk, see DEFERRED_BACKLOG).
      # Blockchain is BLOCKING at --audit-level=critical (WP18 PR-2). Two
      # non-breaking npm overrides cleared the fixable highs: ethers 6.17 (→ ws
      # 8.21, GHSA-58qx) and form-data 4.0.6 (GHSA-hmw2 CRLF injection). The
      # residual prod highs (axios + lodash, both under tronweb 5.3.5) have no
      # non-breaking fix — npm offers only the breaking tronweb 6.x bump — so
      # they are accept-risk + follow-up, and the gate is scoped to prod
      # criticals (0 today). A new prod critical fails CI.
      - name: Sidecar-steam npm audit (advisory)
        working-directory: sidecar-steam
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Sidecar-blockchain npm audit (blocking — prod criticals)
        working-directory: sidecar-blockchain
        run: npm audit --omit=dev --audit-level=critical

  # ----------------------------------------------------------------------------
  # 2. Build  (09 §21.4 step 2)
  # ----------------------------------------------------------------------------
  build:
    name: 2. Build
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: dotnet restore
        working-directory: backend
        run: dotnet restore Skinora.sln

      - name: dotnet build
        working-directory: backend
        run: dotnet build Skinora.sln --configuration Release --no-restore

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Frontend build
        working-directory: frontend
        run: npm ci --include=optional && npm run build

  # ----------------------------------------------------------------------------
  # 3b. JS test (vitest) — frontend + sidecar unit suites (WP18 PR-2)
  # Each step is gated by its own paths-filter output, so a frontend-only PR
  # skips the sidecar suites (and vice versa); a workflow edit trips all three.
  # Blocking via ci-gate.needs. Skipped (not failed) on doc-only PRs.
  # ----------------------------------------------------------------------------
  frontend-test:
    name: 3b. JS test (vitest)
    needs: [changes, build]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs['sidecar-steam'] == 'true' || needs.changes.outputs['sidecar-blockchain'] == 'true' || needs.changes.outputs['sidecar-fake'] == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Frontend vitest
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci && npm run test

      - name: Sidecar-steam vitest
        if: needs.changes.outputs['sidecar-steam'] == 'true'
        working-directory: sidecar-steam
        run: npm ci && npm run test

      - name: Sidecar-blockchain vitest
        if: needs.changes.outputs['sidecar-blockchain'] == 'true'
        working-directory: sidecar-blockchain
        run: npm ci && npm run test

      - name: Sidecar-fake vitest
        if: needs.changes.outputs['sidecar-fake'] == 'true'
        working-directory: sidecar-fake
        run: npm ci && npm run test

  # ----------------------------------------------------------------------------
  # 3. Unit test  (09 §21.4 step 3)
  # Filter: tests NOT in *.Integration namespace
  # ----------------------------------------------------------------------------
  unit-test:
    name: 3. Unit test
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run unit tests
        working-directory: backend
        run: |
          dotnet test Skinora.sln \
            --configuration Release \
            --filter "FullyQualifiedName!~.Integration&FullyQualifiedName!~.Contract" \
            --logger "trx;LogFileName=unit-tests.trx" \
            --logger "console;verbosity=normal" \
            --results-directory ./TestResults

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: backend/TestResults/
          retention-days: 7

  # ----------------------------------------------------------------------------
  # 4. Integration test  (09 §21.4 step 4)
  # Filter: tests in *.Integration namespace
  #
  # T11.3 — a single job-level SQL Server container is shared by every test
  # assembly via INTEGRATION_TEST_SQL_SERVER. IntegrationTestBase creates a
  # unique database per test class on that shared server, so parallel test
  # collections + parallel assemblies do not collide. The hot-fix (`-m:1` +
  # serial xunit.runner.json) is removed — OOM is avoided by having exactly
  # one server instance for the whole run instead of one per test class.
  # ----------------------------------------------------------------------------
  integration-test:
    name: 4. Integration test
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Integration_Pwd1!'
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Integration_Pwd1!' -C -N -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    env:
      INTEGRATION_TEST_SQL_SERVER: 'Server=localhost,1433;User Id=sa;Password=Integration_Pwd1!;TrustServerCertificate=True'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run integration tests
        working-directory: backend
        run: |
          dotnet test Skinora.sln \
            --configuration Release \
            --filter "FullyQualifiedName~.Integration" \
            --logger "trx;LogFileName=integration-tests.trx" \
            --logger "console;verbosity=normal" \
            --results-directory ./TestResults

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: backend/TestResults/
          retention-days: 7

  # ----------------------------------------------------------------------------
  # 5. Contract test  (09 §21.4 step 5)
  # T11.1 — ContractTestBase smoke tests (T12). Gercek sidecar <-> backend schema
  # dogrulamalari F4 sidecar entegrasyonlari (T65, T68) icinde eklenecek.
  # ----------------------------------------------------------------------------
  contract-test:
    name: 5. Contract test
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run contract tests
        working-directory: backend
        run: |
          dotnet test Skinora.sln \
            --configuration Release \
            --filter "FullyQualifiedName~.Contract" \
            --logger "trx;LogFileName=contract-tests.trx" \
            --logger "console;verbosity=normal" \
            --results-directory ./TestResults

      - name: Upload contract test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-results
          path: backend/TestResults/
          retention-days: 7

  # ----------------------------------------------------------------------------
  # 6. Migration dry-run  (09 §21.4 step 6)
  # T28 — actual migration script generation against a fresh SQL Server so
  # schema-level errors surface in CI before they reach a real deploy. Model
  # drift is caught by the InitialMigrationTests Model_HasNoPendingChanges
  # assertion in the integration-test job.
  # ----------------------------------------------------------------------------
  migration-dry-run:
    name: 6. Migration dry-run
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Migration_Pwd1!'
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Migration_Pwd1!' -C -N -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef --version 9.0.3

      - name: dotnet ef dbcontext info (model validation)
        working-directory: backend
        run: |
          dotnet ef dbcontext info \
            --project src/Skinora.Shared/Skinora.Shared.csproj \
            --startup-project src/Skinora.API/Skinora.API.csproj \
            --context AppDbContext

      - name: dotnet ef migrations script (idempotent DDL artefact)
        working-directory: backend
        run: |
          mkdir -p artifacts
          dotnet ef migrations script \
            --idempotent \
            --project src/Skinora.Shared/Skinora.Shared.csproj \
            --startup-project src/Skinora.API/Skinora.API.csproj \
            --context AppDbContext \
            --output artifacts/migrations.sql
          # Sanity — script must not be empty.
          test -s artifacts/migrations.sql

      - name: Apply migrations to empty SQL Server
        working-directory: backend
        env:
          ConnectionStrings__DefaultConnection: 'Server=localhost,1433;Database=SkinoraMigrationDryRun;User Id=sa;Password=Migration_Pwd1!;TrustServerCertificate=True'
        run: |
          dotnet ef database update \
            --project src/Skinora.Shared/Skinora.Shared.csproj \
            --startup-project src/Skinora.API/Skinora.API.csproj \
            --context AppDbContext
          # Idempotency — second update must be a no-op (EF short-circuits on
          # applied migrations). This mirrors what a re-deploy would do.
          dotnet ef database update \
            --project src/Skinora.Shared/Skinora.Shared.csproj \
            --startup-project src/Skinora.API/Skinora.API.csproj \
            --context AppDbContext

      - name: Upload migrations script
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrations-sql
          path: backend/artifacts/migrations.sql
          retention-days: 7

  # ----------------------------------------------------------------------------
  # 7. Docker build check  (kabul kriterleri: image build dogrulamasi)
  # Push YOK — sadece build dogrulamasi. Push isi docker-publish.yml'da.
  # ----------------------------------------------------------------------------
  docker-build-check:
    name: 7. Docker build (${{ matrix.component.name }})
    needs: [changes, build]
    # Only build images whose context actually changed. Matrix is
    # computed by the `changes` job; when empty (no image context
    # touched) the job is skipped entirely.
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.docker-matrix != '{"component":[]}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.docker-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.component.context }}
          push: false
          load: false
          cache-from: type=gha,scope=ci-${{ matrix.component.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.component.name }}

  # ----------------------------------------------------------------------------
  # E2E smoke (T107) — ADVISORY / non-blocking. Boots the docker-compose.e2e.yml
  # backend stack (the fake sidecar stands in for the real Steam/blockchain
  # sidecars), applies migrations, and drives the happy path CREATED -> COMPLETED
  # via the API-level Playwright smoke. continue-on-error + excluded from
  # ci-gate.needs, so a flaky run never blocks a merge (owner decision). The
  # smoke (API + UI) is also proven locally — this is an extra signal.
  # ----------------------------------------------------------------------------
  e2e-smoke:
    name: E2E smoke (advisory)
    needs: [changes]
    if: needs.changes.outputs['e2e-stack'] == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef --version 9.0.3

      - name: Build e2e images (backend + fake sidecar)
        run: docker compose -f docker-compose.e2e.yml build skinora-backend skinora-fake-sidecar

      - name: Start database
        run: docker compose -f docker-compose.e2e.yml up -d skinora-db

      - name: Wait for database health
        run: |
          for i in $(seq 1 40); do
            h=$(docker inspect --format '{{.State.Health.Status}}' skinora-e2e-db 2>/dev/null || echo starting)
            echo "db health: $h"
            [ "$h" = "healthy" ] && exit 0
            sleep 5
          done
          echo "::error::database did not become healthy"; exit 1

      - name: Apply migrations
        working-directory: backend
        env:
          ConnectionStrings__DefaultConnection: 'Server=localhost,14333;Database=Skinora;User Id=sa;Password=E2e!Strong!Pass!2345;TrustServerCertificate=True;'
        run: |
          dotnet ef database update \
            --project src/Skinora.Shared/Skinora.Shared.csproj \
            --startup-project src/Skinora.API/Skinora.API.csproj \
            --context AppDbContext

      - name: Start backend stack
        run: docker compose -f docker-compose.e2e.yml up -d --wait skinora-backend skinora-fake-sidecar

      - name: Run API happy-path smoke
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:5000
          E2E_FAKE_URL: http://localhost:5200
        run: npm ci && npm run test:smoke

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --tail=200

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  # ----------------------------------------------------------------------------
  # CI Gate — toplu PASS kontrolu icin tek required check
  # Branch protection bu job'u required olarak isaretler.
  # ----------------------------------------------------------------------------
  ci-gate:
    name: CI Gate
    needs:
      - changes
      - guard-direct-push
      - lint
      - build
      - frontend-test
      - unit-test
      - integration-test
      - contract-test
      - migration-dry-run
      - docker-build-check
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error title=CI Gate::One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed."
