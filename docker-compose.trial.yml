# =============================================================================
# Skinora — TRIAL deployment overlay (T161). Layered OVER docker-compose.yml:
#
#   docker compose -p skinora-trial --env-file .env.trial \
#     -f docker-compose.yml -f docker-compose.trial.yml [--profile ethereum] \
#     [--profile tunnel] up -d --build --wait
#
# Owner decision 2026-10-21: no rented server yet. The public trial runs on the
# owner's PC (Docker Desktop) on test networks only (TRON Nile + Ethereum
# Sepolia), reached from outside ONLY through a Cloudflare Tunnel. No router
# port is opened. Steps: Docs/DEPLOY_RUNBOOK.md §K.
#
# What this overlay changes, and nothing else:
#   * Its own project — its own containers, network, named volumes and images.
#     `name:` below; -p on the command line wins (T161's port scan used
#     -p skinora-t161). container_name is reset so names derive from the
#     project and never collide with the development stack (skinora-backend …).
#   * Its own configuration: values from .env.trial (--env-file; `.env.*` is
#     gitignored; SKINORA_TRIAL_STACK in it is mandatory, see the guard
#     below) and Docker secrets from ./secrets/trial/ (gitignored).
#   * NO internal port on the host. `ports: !reset []` removes the base file's
#     loopback ports; the database, Redis, backend, sidecars, Loki and
#     Prometheus are reachable only inside the compose network. Three loopback
#     ports stay for the operator on this machine: the edge (local smoke test),
#     Grafana and Uptime Kuma (admin UIs). Nothing binds a LAN address.
#   * Production mode forced (ASPNETCORE_ENVIRONMENT / NODE_ENV) whatever
#     .env.trial says, and Grafana refuses to start on a missing admin password
#     (T171b: secrets/trial/grafana_admin_password.txt; first-boot.sh).
#   * T171a — every Docker secret, the shared ones included, from
#     ./secrets/trial/ (never the development files). T171b — the
#     third-party credentials too (database / Redis / Grafana admin
#     passwords, Steam / TronGrid keys, Ethereum RPC URLs).
#   * The Cloudflare tunnel (profile "tunnel"): cloudflared dials OUT to
#     Cloudflare and forwards to the edge over the compose network. It does not
#     start without its token (skinora-tunnel-preflight below).
#   * T165 — notification channels in their production choice (e-mail +
#     Telegram on, Discord off), Grafana e-mail through Resend SMTP, and the
#     heartbeat container for the outside monitor (DEPLOY_RUNBOOK §P).
#
# Needs Docker Compose >= 2.24 (`!reset` / `!override`). The tags are written
# on every service on purpose: through a YAML anchor (`<<: *x`) compose drops
# them and the base ports silently survive (measured with Compose v5.1.0).
# scripts/compose-exposure.test.mjs renders this file and fails CI on any
# published port that is not loopback, or any internal service that publishes.
# =============================================================================
name: skinora-trial

# Guard against a forgotten `--env-file .env.trial`: without it compose would
# read the DEVELOPMENT .env and bring the trial up with the development wallet
# seed, keys and DB password. SKINORA_TRIAL_STACK is defined ONLY in .env.trial
# (DEPLOY_RUNBOOK K.4 adds it), never in .env.example, so the development
# file cannot satisfy it and the render fails. (An extension field: it reaches
# no container.) Since T171b the passwords themselves are files under
# secrets/trial/, so a forgotten --env-file can no longer pick up the
# development DB password — the guard still keeps the development addresses,
# ports and settings out.
x-skinora-trial-guard: ${SKINORA_TRIAL_STACK:?SKINORA_TRIAL_STACK is not set - the trial overlay needs --env-file .env.trial (append SKINORA_TRIAL_STACK=1 to .env.trial, DEPLOY_RUNBOOK K.4); without it the DEVELOPMENT .env would be used}

services:
  skinora-backend:
    container_name: !reset null
    ports: !reset []
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # The trust boundary for X-Forwarded-For / X-Forwarded-Proto is THIS
      # project's network, pinned below — not .env.trial's
      # REVERSE_PROXY_KNOWN_NETWORK, which a copied .env.example would leave at
      # the development value. Only nginx sets those headers for the backend:
      # behind the tunnel it fills them from Cloudflare's CF-Connecting-IP /
      # X-Forwarded-Proto, trusted from the connector's fixed address alone
      # (T162, nginx/nginx.conf).
      - ReverseProxy__KnownNetworks__0=172.30.161.0/24
      # T169 — the owner's 12-hour delivery window (720 min; legal text says
      # "12 saat"). .env.trial (copied from .env.example) carries 720 already;
      # this default only covers a .env.trial that leaves it empty, so the
      # trial never boots on a shorter window that would cancel a seller who
      # delivered (DEPLOY_RUNBOOK §A #6). Read once, on the first boot of a
      # fresh database (SettingsBootstrapService); an existing database is
      # moved by the T169 migration.
      - SKINORA_SETTING_DELIVERY_TIMEOUT_MINUTES=${SKINORA_SETTING_DELIVERY_TIMEOUT_MINUTES:-720}
      # T165 — the production channel choice (owner decision 2026-10-21):
      # e-mail (Resend) and Telegram ON, Discord OFF. Forced here, not read from
      # .env.trial, so filling the secret files (T171a — secrets/trial/
      # resend_api_key.txt, resend_webhook_signing_secret.txt,
      # telegram_bot_token.txt, telegram_webhook_secret_token.txt) plus
      # TELEGRAM_BOT_USERNAME in .env.trial and restarting the backend is all
      # it takes. Until then both channels run "misconfigured":
      # off for users, error in the backend log, notification-channel-
      # misconfigured alert — never the development stub (DEPLOY_RUNBOOK §P).
      - Resend__Provider=resend
      - Telegram__Provider=telegram
      - Discord__Provider=disabled

  skinora-frontend:
    container_name: !reset null
    ports: !reset []
    environment:
      - NODE_ENV=production

  skinora-steam-sidecar:
    container_name: !reset null
    ports: !reset []
    environment:
      - NODE_ENV=production

  skinora-blockchain-sidecar:
    container_name: !reset null
    ports: !reset []
    environment:
      - NODE_ENV=production

  skinora-ethereum-sidecar:
    container_name: !reset null
    ports: !reset []
    environment:
      - NODE_ENV=production

  # T164 — SQL Server Express (owner decision 2026-10-04: the 10 GB data file
  # limit the db-data-size alarms watch), whatever .env.trial says. Backups
  # into the TRIAL's own host folder — never the development one (both
  # databases are named Skinora; the files would mix). TRIAL_DB_BACKUP_DIR may
  # point at another disk (DEPLOY_RUNBOOK §N.3); .env.example does not carry
  # it, so a copied .env.trial keeps the default.
  skinora-db:
    container_name: !reset null
    ports: !reset []
    environment:
      - MSSQL_PID=Express
    volumes:
      - ${TRIAL_DB_BACKUP_DIR:-./backups/trial/db}:/var/opt/mssql/backup

  skinora-db-backup:
    container_name: !reset null
    volumes:
      - ${TRIAL_DB_BACKUP_DIR:-./backups/trial/db}:/var/opt/mssql/backup

  skinora-redis:
    container_name: !reset null
    ports: !reset []

  skinora-loki:
    container_name: !reset null
    ports: !reset []

  skinora-prometheus:
    container_name: !reset null
    ports: !reset []

  skinora-grafana-provisioning:
    container_name: !reset null

  skinora-grafana:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${TRIAL_GRAFANA_PORT:-3011}:3000"
    environment:
      # No `admin` fallback on a deployment the internet can find: T171b —
      # the admin password is secrets/trial/grafana_admin_password.txt (the
      # base file's GF_SECURITY_ADMIN_PASSWORD__FILE); first-boot.sh refuses
      # to start when it is missing or empty (CREDENTIAL_MISSING).
      # T165 — e-mail alerts through Resend SMTP (base file: host, user,
      # STARTTLS). Only the password (a sending-only Resend key) is needed —
      # T171a: secrets/trial/grafana_smtp_password.txt; while it is empty the e-mail integrations fail at send time and
      # Telegram still delivers; when the FILE is missing Grafana does not start (first-boot.sh,
      # GRAFANA_SMTP_PASSWORD_UNREADABLE) — DEPLOY_RUNBOOK §L.9 / §P.
      - GF_SMTP_ENABLED=true

  skinora-uptime-kuma:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${TRIAL_UPTIME_KUMA_PORT:-3012}:3001"

  # The edge. Outside traffic reaches it from cloudflared over the compose
  # network; the loopback port is only for a local smoke test (curl
  # http://127.0.0.1:8090/nginx-health). No 443 here: TLS ends at Cloudflare.
  skinora-reverse-proxy:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${TRIAL_HTTP_PORT:-8090}:80"

  # T165 — heartbeat ("dead man's switch") to the outside monitor
  # (Healthchecks.io, DEPLOY_RUNBOOK §P). Every HEARTBEAT_INTERVAL_SECONDS it
  # checks the site from inside — the edge's /api/health (nginx → backend →
  # database + Redis), the front page and Grafana's /api/health (the money
  # alarms leave through Grafana) — and pings the ping URL when all three
  # answer. When this PC, Docker or the stack is down, the pings stop and the
  # outside service alerts the owner (e-mail / Telegram) after its grace
  # time. HEARTBEAT_FAILURES_BEFORE_FAIL failed rounds in a row send /fail for
  # an immediate alert. restart: unless-stopped brings it back with Docker
  # Desktop after a reboot. Without a ping URL it idles (logs once). T171a —
  # the ping URL is the Docker secret heartbeat_url
  # (secrets/trial/heartbeat_url.txt), read through HEARTBEAT_URL_FILE; a
  # mount point that is not a readable file stops it (HEARTBEAT_URL_UNREADABLE).
  # Outbound only; publishes no port.
  skinora-heartbeat:
    # curl, not busybox wget: the script's HTTP path is the one its CI test
    # runs (scripts/heartbeat/heartbeat.test.mjs, on the runner's curl).
    image: curlimages/curl:8.21.0
    entrypoint: ["/bin/sh", "/opt/skinora/heartbeat.sh"]
    environment:
      - HEARTBEAT_URL_FILE=/run/secrets/heartbeat_url
      - HEARTBEAT_INTERVAL_SECONDS=${HEARTBEAT_INTERVAL_SECONDS:-60}
      - HEARTBEAT_FAILURES_BEFORE_FAIL=${HEARTBEAT_FAILURES_BEFORE_FAIL:-3}
      # T165 kapanış (yeniden doğrulama Y1, ⚠ PARA): Grafana's own health too.
      # Every Grafana money alarm (category: money) leaves through Grafana; when
      # it is down — or never starts (first-boot guard) — nothing else says so.
      # Container-network address: Grafana publishes only 127.0.0.1:3001.
      - HEARTBEAT_CHECK_URLS=http://skinora-reverse-proxy/api/health http://skinora-reverse-proxy/ http://skinora-grafana:3000/api/health
    volumes:
      - ./scripts/heartbeat/heartbeat.sh:/opt/skinora/heartbeat.sh:ro
    secrets:
      - heartbeat_url
    depends_on:
      skinora-reverse-proxy:
        condition: service_started
    restart: unless-stopped
    networks:
      - skinora-network

  # Fail-closed gate of the tunnel: exits 1 when the token secret is empty, so
  # cloudflared (which waits for it to complete successfully) never starts
  # without a token instead of crash-looping on one it cannot use.
  skinora-tunnel-preflight:
    image: alpine:3.20
    profiles: ["tunnel"]
    secrets:
      - cloudflare_tunnel_token
    command:
      - sh
      - -c
      - |
        if [ -s /run/secrets/cloudflare_tunnel_token ] && grep -q '[^[:space:]]' /run/secrets/cloudflare_tunnel_token; then
          echo "tunnel token present"
        else
          echo "TUNNEL_TOKEN_MISSING: secrets/trial/cloudflare_tunnel_token.txt is empty - the tunnel does not start without it (DEPLOY_RUNBOOK §K.5)" >&2
          exit 1
        fi
    networks:
      - skinora-network

  # Cloudflare Tunnel connector (T161 ready, T162 connects it to
  # getskinora.com). Outbound-only: it opens no port on the host. The public
  # hostname and its origin (http://skinora-reverse-proxy:80) are set on the
  # tunnel in the Cloudflare dashboard; this container only carries the token,
  # read from a Docker secret file so `docker inspect` does not show it.
  # T162 — FIXED address 172.30.161.250: nginx trusts CF-Connecting-IP,
  # CF-IPCountry and X-Forwarded-Proto from this address alone
  # (nginx/nginx.conf set_real_ip_from + geo). It lies outside the network's
  # dynamic ip_range, so no other container can be handed it. Changing it
  # means changing nginx.conf in the same commit (compose-exposure test).
  skinora-cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      - TUNNEL_TOKEN_FILE=/run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    depends_on:
      skinora-tunnel-preflight:
        condition: service_completed_successfully
      skinora-reverse-proxy:
        condition: service_healthy
    restart: unless-stopped
    networks:
      skinora-network:
        ipv4_address: 172.30.161.250

# The trial's own network, with a pinned subnet: the backend's forwarded-header
# trust (above) names exactly this range. T162 — dynamic addresses come only
# from the lower half (ip_range), so the connector's fixed .250 can never be
# handed to another container. Literals, not variables: nginx.conf cannot read
# a variable, and a subnet that moved without it would silently drop the
# tunnel's client IP (the earlier TRIAL_NETWORK_SUBNET knob is gone).
networks:
  skinora-network:
    ipam:
      config:
        - subnet: 172.30.161.0/24
          ip_range: 172.30.161.0/25

# The trial's own secrets — never the development ones under ./secrets.
# T171a — the shared secrets too: the trial's JWT key, webhook secrets and
# internal keys are its own (DEPLOY_RUNBOOK §K.4 step 2, §L.9).
secrets:
  tron_hd_mnemonic:
    file: ./secrets/trial/tron_hd_mnemonic.txt
  tron_hot_wallet_private_key:
    file: ./secrets/trial/tron_hot_wallet_private_key.txt
  ethereum_hd_mnemonic:
    file: ./secrets/trial/ethereum_hd_mnemonic.txt
  ethereum_hot_wallet_private_key:
    file: ./secrets/trial/ethereum_hot_wallet_private_key.txt
  ethereum_fuel_wallet_private_key:
    file: ./secrets/trial/ethereum_fuel_wallet_private_key.txt
  cloudflare_tunnel_token:
    file: ./secrets/trial/cloudflare_tunnel_token.txt
  jwt_secret:
    file: ./secrets/trial/jwt_secret.txt
  blockchain_webhook_secret:
    file: ./secrets/trial/blockchain_webhook_secret.txt
  ethereum_webhook_secret:
    file: ./secrets/trial/ethereum_webhook_secret.txt
  steam_sidecar_internal_key:
    file: ./secrets/trial/steam_sidecar_internal_key.txt
  blockchain_sidecar_internal_key:
    file: ./secrets/trial/blockchain_sidecar_internal_key.txt
  ethereum_sidecar_internal_key:
    file: ./secrets/trial/ethereum_sidecar_internal_key.txt
  resend_api_key:
    file: ./secrets/trial/resend_api_key.txt
  resend_webhook_signing_secret:
    file: ./secrets/trial/resend_webhook_signing_secret.txt
  telegram_bot_token:
    file: ./secrets/trial/telegram_bot_token.txt
  telegram_webhook_secret_token:
    file: ./secrets/trial/telegram_webhook_secret_token.txt
  grafana_smtp_password:
    file: ./secrets/trial/grafana_smtp_password.txt
  heartbeat_url:
    file: ./secrets/trial/heartbeat_url.txt
  # T171b — the trial's own third-party credentials.
  mssql_sa_password:
    file: ./secrets/trial/mssql_sa_password.txt
  redis_password:
    file: ./secrets/trial/redis_password.txt
  grafana_admin_password:
    file: ./secrets/trial/grafana_admin_password.txt
  steam_api_key:
    file: ./secrets/trial/steam_api_key.txt
  tron_api_key:
    file: ./secrets/trial/tron_api_key.txt
  tron_api_key_secondary:
    file: ./secrets/trial/tron_api_key_secondary.txt
  ethereum_rpc_primary_url:
    file: ./secrets/trial/ethereum_rpc_primary_url.txt
  ethereum_rpc_backup_url:
    file: ./secrets/trial/ethereum_rpc_backup_url.txt
