# Development overrides — used automatically by docker compose up
#
# T161 — no `ports:` here. docker-compose.yml already publishes every port on
# 127.0.0.1; compose APPENDS list entries from an override, so a bare
# "5000:5000" here would have added a second, 0.0.0.0 binding of the same port
# next to the loopback one (LAN-reachable database and sidecars).
services:
  skinora-backend:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  skinora-frontend:
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules

  skinora-steam-sidecar:
    environment:
      - NODE_ENV=development
    volumes:
      - ./sidecar-steam:/app
      - /app/node_modules

  skinora-blockchain-sidecar:
    environment:
      - NODE_ENV=development
    volumes:
      - ./sidecar-blockchain:/app
      - /app/node_modules
