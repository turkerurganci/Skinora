# =============================================================================
# Skinora — full application stack (real configuration).
#
# RUN IT EXPLICITLY WITH -f:
#   docker compose -f docker-compose.yml up -d --build --wait
#
# A bare `docker compose up` also layers docker-compose.override.yml, which
# bind-mounts host source over the frontend and sidecar images. Those images are
# production builds (Next.js .next/standalone, sidecar dist/) — the bind mount
# hides their entrypoints and the containers fail to start. The override file is
# a dev template; keep it out of real runs.
#
# Values come from .env (gitignored). This file contains ${VAR} references only —
# never a secret literal. Services receive only the env they need: hot-wallet and
# HD-wallet signing material goes to the blockchain sidecar alone.
#
# Prerequisite: the schema is NOT auto-migrated at startup. Apply migrations
# before first boot — see Docs/DEPLOY_RUNBOOK.md §G.
# =============================================================================
services:
  # --- Application Services ---

  skinora-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skinora-backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    # Every value is a ${VAR} reference resolved from .env (gitignored) — no
    # secret literal lives in this file. Each service receives ONLY the env it
    # needs: HOT_WALLET_PRIVATE_KEY and HD_WALLET_MNEMONIC are deliberately
    # absent here so the backend never sees signing material (F4 gate check).
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - Redis__ConnectionString=${REDIS_CONNECTION_STRING}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER:-skinora}
      - Jwt__Audience=${JWT_AUDIENCE:-skinora-client}
      - Jwt__AccessTokenExpiryMinutes=${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:-15}
      - Jwt__RefreshTokenExpiryDays=${JWT_REFRESH_TOKEN_EXPIRY_DAYS:-7}
      - Webhook__BlockchainSharedSecret=${BLOCKCHAIN_WEBHOOK_SECRET:-${WEBHOOK_SECRET}}
      - Serilog__WriteTo__1__Args__uri=${LOKI_URL:-http://skinora-loki:3100}
      # Browser-facing origin — CORS. The frontend is same-origin behind nginx,
      # so this only matters for direct :5000 access and non-browser clients.
      - Cors__AllowedOrigins__0=${PUBLIC_ORIGIN:-http://localhost:8080}
      # F3a — Reverse proxy güveni (ForwardedHeadersNotRegistered).
      # Bu DEĞER YOKSA UseForwardedHeaders hiç kaydedilmez ve backend istemci
      # IP'sini göremez (bugünkü davranış). Değer verilince güven SADECE burada
      # yazan ağla sınırlıdır — X-Forwarded-For'a körü körüne güvenmek istemcinin
      # rate limit ve geo-block'u birlikte atlamasına izin verirdi.
      # 172.20.0.0/16 = bu compose dosyasının skinora-network alt ağı.
      - ReverseProxy__KnownNetworks__0=${REVERSE_PROXY_KNOWN_NETWORK:-172.20.0.0/16}
      - ReverseProxy__ForwardLimit=${REVERSE_PROXY_FORWARD_LIMIT:-1}
      # Steam OpenID 2.0 — appsettings.json defaults point at https://skinora.com;
      # without these overrides real Steam login redirects to a dead domain.
      - SteamOpenId__Realm=${STEAM_OPENID_REALM}
      - SteamOpenId__ReturnToUrl=${STEAM_OPENID_RETURN_TO}
      - SteamOpenId__ReVerifyReturnToUrl=${STEAM_OPENID_REVERIFY_RETURN_TO}
      - SteamOpenId__FrontendCallbackUrl=${STEAM_OPENID_FRONTEND_CALLBACK}
      - SteamOpenId__WebApiKey=${STEAM_API_KEY}
      # Backend → sidecar internal API auth (X-Internal-Key, 05 §3.4). Must match
      # the INTERNAL_KEY each sidecar receives below.
      - SteamSidecar__BaseUrl=http://skinora-steam-sidecar:5100
      - SteamSidecar__InternalKey=${STEAM_SIDECAR_INTERNAL_KEY:-${INTERNAL_KEY}}
      - BlockchainSidecar__BaseUrl=http://skinora-blockchain-sidecar:5200
      - BlockchainSidecar__InternalKey=${BLOCKCHAIN_SIDECAR_INTERNAL_KEY:-${INTERNAL_KEY}}
      # TRC-20 contracts the backend arms the payment monitor with. Same two
      # values the sidecar reads below — they MUST agree, or the sidecar
      # classifies a real deposit as wrong_token and auto-refunds it. Empty
      # falls back to the mainnet constants (08 §3.3).
      - StablecoinContracts__Usdt=${TRON_USDT_CONTRACT:-}
      - StablecoinContracts__Usdc=${TRON_USDC_CONTRACT:-}
      # Price source for the PRICE_DEVIATION fraud rule (DEPLOY_RUNBOOK §C.1).
      # Default "logging" = fail-open, no outbound call to steamcommunity.com.
      - SteamMarket__Provider=${STEAM_MARKET_PROVIDER:-logging}
      # --- 19 mandatory SystemSettings (DEPLOY_RUNBOOK §A) ---
      # SettingsBootstrapService hydrates unconfigured rows from these and
      # FAIL-FASTS (InvalidOperationException → container exit) on any missing or
      # out-of-range value. Rows already configured via the admin UI are never
      # overridden (06 §8.9). Enumerated explicitly rather than `env_file: .env`
      # so the backend receives nothing beyond what it needs.
      - SKINORA_SETTING_ACCEPT_TIMEOUT_MINUTES=${SKINORA_SETTING_ACCEPT_TIMEOUT_MINUTES}
      - SKINORA_SETTING_SELLER_CONFIRM_TIMEOUT_MINUTES=${SKINORA_SETTING_SELLER_CONFIRM_TIMEOUT_MINUTES}
      - SKINORA_SETTING_PAYMENT_TIMEOUT_MIN_MINUTES=${SKINORA_SETTING_PAYMENT_TIMEOUT_MIN_MINUTES}
      - SKINORA_SETTING_PAYMENT_TIMEOUT_MAX_MINUTES=${SKINORA_SETTING_PAYMENT_TIMEOUT_MAX_MINUTES}
      - SKINORA_SETTING_PAYMENT_TIMEOUT_DEFAULT_MINUTES=${SKINORA_SETTING_PAYMENT_TIMEOUT_DEFAULT_MINUTES}
      - SKINORA_SETTING_DELIVERY_TIMEOUT_MINUTES=${SKINORA_SETTING_DELIVERY_TIMEOUT_MINUTES}
      - SKINORA_SETTING_MIN_TRANSACTION_AMOUNT=${SKINORA_SETTING_MIN_TRANSACTION_AMOUNT}
      - SKINORA_SETTING_MAX_TRANSACTION_AMOUNT=${SKINORA_SETTING_MAX_TRANSACTION_AMOUNT}
      - SKINORA_SETTING_MAX_CONCURRENT_TRANSACTIONS=${SKINORA_SETTING_MAX_CONCURRENT_TRANSACTIONS}
      - SKINORA_SETTING_NEW_ACCOUNT_TRANSACTION_LIMIT=${SKINORA_SETTING_NEW_ACCOUNT_TRANSACTION_LIMIT}
      - SKINORA_SETTING_NEW_ACCOUNT_PERIOD_DAYS=${SKINORA_SETTING_NEW_ACCOUNT_PERIOD_DAYS}
      - SKINORA_SETTING_CANCEL_LIMIT_COUNT=${SKINORA_SETTING_CANCEL_LIMIT_COUNT}
      - SKINORA_SETTING_CANCEL_LIMIT_PERIOD_HOURS=${SKINORA_SETTING_CANCEL_LIMIT_PERIOD_HOURS}
      - SKINORA_SETTING_CANCEL_COOLDOWN_HOURS=${SKINORA_SETTING_CANCEL_COOLDOWN_HOURS}
      - SKINORA_SETTING_HIGH_VOLUME_AMOUNT_THRESHOLD=${SKINORA_SETTING_HIGH_VOLUME_AMOUNT_THRESHOLD}
      - SKINORA_SETTING_HIGH_VOLUME_COUNT_THRESHOLD=${SKINORA_SETTING_HIGH_VOLUME_COUNT_THRESHOLD}
      - SKINORA_SETTING_HIGH_VOLUME_PERIOD_HOURS=${SKINORA_SETTING_HIGH_VOLUME_PERIOD_HOURS}
      - SKINORA_SETTING_HOT_WALLET_LIMIT=${SKINORA_SETTING_HOT_WALLET_LIMIT}
      - SKINORA_SETTING_DORMANT_ACCOUNT_VALUE_THRESHOLD=${SKINORA_SETTING_DORMANT_ACCOUNT_VALUE_THRESHOLD}
      # NOTE: the DEPLOY_RUNBOOK §C "recommended" settings (reconciliation
      # wallet addresses, auth.banned_countries, multi_account.exchange_addresses,
      # price_deviation_threshold) are NOT listed here on purpose. They ship as
      # seeded Default rows (IsConfigured = true), and the bootstrap only touches
      # unconfigured rows — env never overrides a configured value (06 §8.9). They
      # are changed through the admin UI only.
    depends_on:
      skinora-db:
        condition: service_healthy
      skinora-redis:
        condition: service_healthy
      skinora-loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - skinora-network

  skinora-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* must be passed HERE, not under `environment` — Next.js
        # inlines them into the client bundle at build time. Empty keeps the
        # mainnet default; set TRONSCAN_TX_BASE_URL on a testnet deployment
        # (e.g. https://nile.tronscan.org/#/transaction/) or every explorer
        # link points at a chain the deployment is not watching.
        - NEXT_PUBLIC_TRONSCAN_TX_BASE_URL=${TRONSCAN_TX_BASE_URL:-}
    container_name: skinora-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      # NOTE: NEXT_PUBLIC_* are inlined by Next.js at BUILD time, so this line
      # does NOT reach the browser bundle — pass such values under `build.args`
      # above instead. The image ships with the same-origin defaults
      # ("/api/v1", "/hubs") which is exactly right behind nginx. Kept for
      # parity with a future split-origin build; change the image, not this line.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    depends_on:
      skinora-backend:
        condition: service_healthy
    # The runner image is node:20-slim — it has neither wget nor curl, so probe
    # with node's global fetch. The health route is /api/health (Next App
    # Router); plain /health 404s. A wget-based check on /health therefore never
    # passed, which also kept nginx from starting (it waits on service_healthy).
    # Same probe as docker-compose.e2e.yml.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - skinora-network

  skinora-steam-sidecar:
    build:
      context: ./sidecar-steam
      dockerfile: Dockerfile
    container_name: skinora-steam-sidecar
    ports:
      - "${STEAM_SIDECAR_PORT:-5100}:5100"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - BACKEND_URL=${STEAM_SIDECAR_BACKEND_URL:-http://skinora-backend:5000}
      # The sidecar's ONLY Steam credential (T133): a Web API key for anonymous
      # inventory reads and trade-hold probes. No bot account, no password, no
      # maFile secret — the custody layer that needed them is gone (05 §3.2).
      # No WEBHOOK_SECRET either: this sidecar signs nothing any more.
      - STEAM_API_KEY=${STEAM_API_KEY}
      # Must match the backend's SteamSidecar__InternalKey above.
      - INTERNAL_KEY=${STEAM_SIDECAR_INTERNAL_KEY:-${INTERNAL_KEY}}
      # Inventory cache (08 §2.3). Empty → in-memory fallback.
      - REDIS_URL=${STEAM_SIDECAR_REDIS_URL:-}
      # Steam Community inventory queue ceiling (08 §2.6, T120). Separate from
      # the Web API queue; unset → 10/min (conservative end of the estimated
      # 10-20/min per-IP range).
      - STEAM_COMMUNITY_REQUESTS_PER_MINUTE=${STEAM_SIDECAR_COMMUNITY_REQUESTS_PER_MINUTE:-}
      - LOKI_URL=${LOKI_URL:-http://skinora-loki:3100}
    depends_on:
      skinora-backend:
        condition: service_healthy
      skinora-loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - skinora-network

  skinora-blockchain-sidecar:
    build:
      context: ./sidecar-blockchain
      dockerfile: Dockerfile
    container_name: skinora-blockchain-sidecar
    ports:
      - "${BLOCKCHAIN_SIDECAR_PORT:-5200}:5200"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - BACKEND_URL=${BLOCKCHAIN_SIDECAR_BACKEND_URL:-http://skinora-backend:5000}
      - TRON_NETWORK=${TRON_NETWORK:-nile}
      - TRON_FULL_NODE_URL=${TRON_FULL_NODE_URL}
      # TRC-20 contracts (08 §3.3). Mainnet addresses are compiled in; on
      # nile/shasta these MUST be set or the supported-token allowlist is empty
      # and every incoming transfer is classified as wrong/spam token.
      - TRON_USDT_CONTRACT=${TRON_USDT_CONTRACT:-}
      - TRON_USDC_CONTRACT=${TRON_USDC_CONTRACT:-}
      - HD_WALLET_MNEMONIC=${HD_WALLET_MNEMONIC}
      # Hot wallet signing material — ONLY this service receives it (05 §3.3/§3.5).
      - HOT_WALLET_ADDRESS=${HOT_WALLET_ADDRESS:-}
      - HOT_WALLET_PRIVATE_KEY=${HOT_WALLET_PRIVATE_KEY:-}
      # Must match the backend's BlockchainSidecar__InternalKey above.
      - INTERNAL_KEY=${BLOCKCHAIN_SIDECAR_INTERNAL_KEY:-${INTERNAL_KEY}}
      - WEBHOOK_SECRET=${BLOCKCHAIN_WEBHOOK_SECRET:-${WEBHOOK_SECRET}}
      - TRON_API_KEY=${TRON_API_KEY}
      - TRON_API_KEY_SECONDARY=${TRON_API_KEY_SECONDARY:-}
      - PAYMENT_POLLING_INTERVAL_MS=${PAYMENT_POLLING_INTERVAL_MS:-3000}
      - MIN_CONFIRMATIONS=${MIN_CONFIRMATIONS:-20}
      # Sidecar-authoritative cadence/sweep knobs (DEPLOY_RUNBOOK §D). The
      # backend SystemSetting copies are for admin visibility only and do NOT
      # propagate to a running sidecar — keep both in parity and restart here.
      - POST_CANCEL_CADENCE_24H_MS=${POST_CANCEL_CADENCE_24H_MS:-30000}
      - POST_CANCEL_CADENCE_7D_MS=${POST_CANCEL_CADENCE_7D_MS:-300000}
      - POST_CANCEL_CADENCE_30D_MS=${POST_CANCEL_CADENCE_30D_MS:-3600000}
      - SWEEP_ENERGY_DELEGATION_SUN=${SWEEP_ENERGY_DELEGATION_SUN:-200000000}
      - SWEEP_TRX_FALLBACK_SUN=${SWEEP_TRX_FALLBACK_SUN:-15000000}
      - LOKI_URL=${LOKI_URL:-http://skinora-loki:3100}
    depends_on:
      skinora-backend:
        condition: service_healthy
      skinora-loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5200/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - skinora-network

  # --- Infrastructure Services ---

  skinora-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: skinora-db
    ports:
      - "${DB_PORT:-1433}:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=${MSSQL_PID:-Developer}
    volumes:
      - skinora-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' -C || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - skinora-network

  skinora-redis:
    image: redis:7-alpine
    container_name: skinora-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - skinora-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - skinora-network

  # --- Observability (T08) ---

  skinora-loki:
    image: grafana/loki:3.2.1
    container_name: skinora-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - skinora-loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - skinora-network

  skinora-prometheus:
    image: prom/prometheus:v2.53.3
    container_name: skinora-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - skinora-prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - skinora-network

  # Renders infra/grafana/provisioning into a volume with the alerting contact
  # point placeholders substituted, then exits. Grafana consumes the rendered
  # copy instead of the host directory.
  #
  # Why a render step instead of letting Grafana interpolate ${VAR} itself:
  # Grafana's provisioning interpolation re-types the substituted value, so a
  # Telegram chat id — always numeric — arrives as a JSON number and fails
  # against the integration's string field:
  #   "cannot unmarshal number into Go struct field Config.chatid of type string"
  # Grafana then aborts startup and the container crash-loops. Verified on
  # grafana/grafana:11.3.0: a literal quoted chat id boots healthy, ${VAR} and
  # $__env{VAR} both fail. Substituting before Grafana parses the file keeps the
  # value inside its YAML quotes, so it stays a string.
  #
  # sed uses | as the delimiter: Telegram tokens/chat ids and e-mail addresses
  # cannot contain it. $$ escapes compose's own interpolation.
  skinora-grafana-provisioning:
    image: alpine:3.20
    container_name: skinora-grafana-provisioning
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO}
    volumes:
      - ./infra/grafana/provisioning:/src:ro
      - skinora-grafana-provisioning:/out
    command:
      - sh
      - -c
      - |
        set -e
        rm -rf /out/* /out/.[!.]* 2>/dev/null || true
        cp -a /src/. /out/
        # Grafana logs an error for this directory when it is absent; harmless
        # but noisy, and it costs nothing to create.
        mkdir -p /out/plugins
        sed -i \
          -e "s|[$$]{TELEGRAM_BOT_TOKEN}|$$TELEGRAM_BOT_TOKEN|g" \
          -e "s|[$$]{TELEGRAM_CHAT_ID}|$$TELEGRAM_CHAT_ID|g" \
          -e "s|[$$]{ALERT_EMAIL_TO}|$$ALERT_EMAIL_TO|g" \
          /out/alerting/contactpoints.yml
        echo "grafana provisioning rendered"
    networks:
      - skinora-network

  skinora-grafana:
    image: grafana/grafana:11.3.0
    container_name: skinora-grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      # Rendered copy, not ./infra/grafana/provisioning — see the render service.
      - skinora-grafana-provisioning:/etc/grafana/provisioning:ro
      - skinora-grafana-data:/var/lib/grafana
    depends_on:
      skinora-grafana-provisioning:
        condition: service_completed_successfully
      skinora-loki:
        condition: service_started
      skinora-prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - skinora-network

  skinora-uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: skinora-uptime-kuma
    ports:
      - "${UPTIME_KUMA_PORT:-3002}:3001"
    volumes:
      - skinora-uptime-kuma-data:/app/data
    depends_on:
      skinora-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - skinora-network

  skinora-reverse-proxy:
    image: nginx:alpine
    container_name: skinora-reverse-proxy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      skinora-backend:
        condition: service_healthy
      skinora-frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - skinora-network

volumes:
  skinora-db-data:
  skinora-redis-data:
  skinora-loki-data:
  skinora-prometheus-data:
  skinora-grafana-data:
  # Rendered provisioning tree — rewritten from ./infra/grafana/provisioning on
  # every `up` by skinora-grafana-provisioning. Never edit it directly.
  skinora-grafana-provisioning:
  skinora-uptime-kuma-data:

networks:
  skinora-network:
    driver: bridge
